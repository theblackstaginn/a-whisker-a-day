  <style>
:root {
  --page: #ebe4d3; --paper:#fbf5e6; --paper-2:#f4ebd6; --paper-3:#e8dcc3;
  --ink:#354035; --muted:#74786a; --forest:#3f5948; --forest-deep:#283f33;
  --sage:#7f9270; --light-sage:#e3e8d9; --moss:#5c7152; --clay:#ab7958;
  --gold:#b38a4d; --dark-gold:#95703e; --border:#d8ceb7; --shadow:rgba(71,58,37,.1);
  --radius:19px; --ease:cubic-bezier(.22,.8,.28,1);
  font-synthesis:none; color-scheme:light;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth;-webkit-tap-highlight-color:transparent}
body{margin:0;color:var(--ink);background:var(--page);font:15px/1.55 'DM Sans','Trebuchet MS',sans-serif;min-height:100vh}
body:before{content:'';position:fixed;inset:0;pointer-events:none;z-index:-1;background:radial-gradient(ellipse at 10% 15%,#f9f3e5a3,transparent 43%),radial-gradient(ellipse at 98% 80%,#d4dbc5a3,transparent 35%)}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer;touch-action:manipulation} button:disabled{cursor:not-allowed;opacity:.48}
a{color:var(--forest);text-decoration-thickness:1px;text-underline-offset:3px}
button:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible,a:focus-visible{outline:3px solid #a07d3d;outline-offset:3px}
button,input,textarea,select{border-radius:10px}
svg{display:block}.icon-svg{width:21px;height:21px;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round;flex-shrink:0}
.hidden,[hidden]{display:none!important}
.skip-link{position:fixed;top:-100px;left:16px;z-index:999;background:var(--forest-deep);color:white;padding:8px 14px}
.skip-link:focus{top:12px}
.app-frame{max-width:1640px;margin:0 auto;min-height:100vh;background:linear-gradient(135deg,#f1ebdc 0%,#ebe5d7 70%);box-shadow:0 0 80px #483b251a}
.topbar{position:sticky;top:0;z-index:20;height:87px;display:flex;align-items:center;justify-content:space-between;padding:0 clamp(16px,3.4vw,48px);background:rgba(249,245,231,.94);backdrop-filter:blur(16px);border-bottom:1px solid #d8cbb2}
.brand{display:flex;align-items:center;gap:11px;text-align:left;background:transparent;border:0;padding:4px 0;color:var(--forest-deep)}
.brand-mark{width:54px;height:54px;filter:drop-shadow(0 4px 3px #3a432625)}
.brand-copy{display:flex;flex-direction:column;line-height:1.12}.brand-title{font-family:'Fraunces',Georgia,serif;font-weight:600;letter-spacing:-1.4px;font-size:clamp(20px,2.3vw,27px)}.brand-title i{font-style:italic;color:var(--clay)}
.brand-tagline{font-size:10px;letter-spacing:1.5px;color:#8c816c;text-transform:uppercase;margin-top:7px;font-weight:700}
.topbar-actions{display:flex;align-items:center;gap:11px}
.header-icon-btn{height:43px;width:43px;display:grid;place-items:center;border:1px solid var(--border);background:#f5eedf;color:var(--forest);border-radius:50%;transition:all .2s}.header-icon-btn:hover{background:#e9e7d4;transform:translateY(-2px)}.moon-top{font-family:Georgia,serif;font-size:30px;line-height:1}
.season-chip{border:1px solid #d3c9b1;border-radius:20px;padding:6px 13px;background:#eee8d5;font-size:11px;color:#786647;letter-spacing:.4px;white-space:nowrap}
.app-layout{display:grid;grid-template-columns:236px minmax(0,1fr);min-height:calc(100vh - 87px)}
.sidebar{border-right:1px solid #d6cbb4;background:linear-gradient(180deg,#ede8d7,#e5e4d0);padding:30px 13px 23px;position:sticky;top:87px;height:calc(100vh - 87px);display:flex;flex-direction:column;justify-content:space-between}
.eyebrow{font-size:10px;letter-spacing:2px;text-transform:uppercase;font-weight:700;color:var(--clay);margin:0}.eyebrow.muted{padding-left:17px;color:#8f927b;margin-bottom:17px}
.side-navigation{display:grid;gap:5px}.nav-link{border:1px solid transparent;background:transparent;width:100%;display:flex;align-items:center;gap:13px;text-align:left;padding:12px 15px;color:#647264;font-size:13px;font-weight:600;border-radius:12px;transition:.2s}.nav-link .icon-svg{width:20px;height:20px}.nav-link:hover{background:#f6efdf;color:var(--forest)}.nav-link.active{background:#f8f2e6;border-color:#d8cdb7;box-shadow:0 3px 8px #6f60421a;color:var(--forest-deep)}
.sidebar-bottom{padding:0 11px}.moon-note{display:flex;gap:10px;align-items:center;border-top:1px solid #cbc8b3;padding-top:17px;font-size:13px}.moon-note>div{display:flex;flex-direction:column}.moon-note-icon{font:36px Georgia;color:var(--gold)}.sidebar-quote{font-family:Georgia,serif;font-size:15px;font-style:italic;color:#78806b;line-height:1.4;margin:19px 0}.privacy-foot{font-size:10px;color:#8e8d7c}
.main-area{min-width:0;padding:30px clamp(16px,3.3vw,55px) 70px}
.view{max-width:1140px;margin:auto;animation:view-arrive .48s var(--ease) both}
@keyframes view-arrive{from{opacity:.01;transform:translateY(9px)}to{opacity:1;transform:translateY(0)}}

.story-portrait{background:#f5edd9;box-shadow:inset 0 0 0 3px #fff9e5}
.modal-panel{background:linear-gradient(140deg,#fffaf0,#f4ebd8);box-shadow:0 24px 80px #211c1645,0 0 0 4px #c7af834a}
.mobile-nav{background:linear-gradient(180deg,#fffbf0f5,#f2efdfed);border-top-color:#cfbd9f}
@media(max-width:700px){
  .scene-wrap{height:clamp(298px,82vw,400px)}
  .yarrow-stage{width:clamp(163px,40%,230px);bottom:9%}
  .scene-filigree{inset:8px;border-radius:13px}
  .scene-filigree:before,.scene-filigree:after{font-size:18px;top:-9px}
  .scene-caption{font-size:11px;bottom:12px;left:11px;padding:6px 10px}
  .pet-cue{display:none}
  .scene-dust i:nth-child(n+8){display:none}
  .page-title{letter-spacing:-.03em}
  .action-tile:before{width:105px;height:105px;right:-24px;bottom:-37px}
  .action-tile .round-icon{height:40px;width:40px}
}
@media(prefers-reduced-motion:reduce){.ambient-ray,.scene-dust i,.mirror-circle,.cat-figure .cat-charm-glint{animation:none!important}}
body.motion-off .ambient-ray,body.motion-off .scene-dust i,body.motion-off .mirror-circle,body.motion-off .cat-figure .cat-charm-glint{animation:none!important}

.hearth-reimagined{max-width:1050px}
.hearth-reimagined .whisper-ribbon{position:relative;isolation:isolate;min-height:92px;display:grid;place-items:center;padding:17px 75px 14px;background:linear-gradient(135deg,#fff9eb,#f4ead6 85%);border:1px solid #bd9e6d;border-radius:23px;text-align:center;box-shadow:0 0 0 3px #f9f1dc,0 0 0 4px #c8b38d,0 7px 16px #71592e1a;margin:3px 5px 18px;overflow:hidden}
.whisper-ribbon:before{content:'';position:absolute;inset:5px;border:1px solid #dcc8a4;border-radius:18px;pointer-events:none}
.whisper-eyebrow{font-size:10px;text-transform:uppercase;letter-spacing:2.5px;font-weight:800;color:#946b41}
.whisper-ribbon p{font:italic 22px/1.28 Georgia,'Times New Roman',serif;letter-spacing:-.5px;color:#365743;margin:5px 0 0}
.whisper-ribbon .whisper-star{display:block;margin-top:5px;font:19px/1 Georgia;color:#af8d5b}
.whisper-flower{font:69px/1 Georgia;color:#729069;position:absolute;opacity:.48;z-index:-1;bottom:-20px;pointer-events:none;text-shadow:15px -7px 5px #a5ad7831}.whisper-flower-left{left:-3px;transform:rotate(-40deg)}.whisper-flower-right{right:-3px;transform:scaleX(-1) rotate(-40deg)}
.storybook-feature-grid{display:grid;grid-template-columns:minmax(0,1.26fr) minmax(0,.8fr);gap:16px}
.storybook-feature{position:relative;isolation:isolate;min-width:0;overflow:hidden;border:1px solid #d2bb90;border-radius:24px;background:#f9f1e3;box-shadow:0 3px 4px #76553217,0 15px 24px #6f563626}
.storybook-feature:after{content:'';position:absolute;inset:0;pointer-events:none;z-index:5;border:5px solid #fff6e77a;border-radius:inherit;box-shadow:inset 0 0 0 1px #e0caa477}
.today-feature{min-height:440px;display:flex;align-items:stretch;background:linear-gradient(105deg,#fff8e9 0%,#f6ecdb 50%,#b9a085 100%)}
.story-art{position:absolute;pointer-events:none;top:0;bottom:0;right:0;z-index:0;background-repeat:no-repeat;background-position:center center;background-size:cover}
.hero-photo{width:67%;background-image:var(--yarrow-real-art);background-position:8% 50%;mask-image:linear-gradient(90deg,transparent 0%,#000 24%);-webkit-mask-image:linear-gradient(90deg,transparent 0%,#000 24%);animation:story-warmth 11s ease-in-out infinite alternate}
.story-art-glow{position:absolute;inset:0;pointer-events:none;background:linear-gradient(90deg,#fff8e9 0%,#fff8e9f3 34%,#fff8e9a9 50%,transparent 73%);z-index:1}
.today-feature-content{position:relative;z-index:4;align-self:stretch;width:64%;padding:29px 12px 23px 26px;display:flex;flex-direction:column;align-items:flex-start;pointer-events:none}
.today-feature-content .btn,.today-feature-content .story-petals{pointer-events:auto}
.story-feature-title{font:500 clamp(32px,3.6vw,49px)/1.05 Georgia,'Times New Roman',serif;letter-spacing:-1.5px;color:#233f30;margin:0 0 13px;text-shadow:0 1px 0 #fff8e9}
.today-feature .story-feature-title{color:#243e2d}
.story-petals{font-size:12px;padding:7px 13px;background:#f5e8bfed;color:#7b562e;border:1px solid #e0c68e;box-shadow:0 2px 5px #64502318}
.story-progress-row{margin:27px 0 15px;display:flex;align-items:center;gap:13px;min-width:0;width:100%}
.story-progress-ring{height:95px;width:95px;background:conic-gradient(#48694f calc(var(--p) * 1%),#d6dcc2 0);outline:4px solid #fff8e2ad;outline-offset:0;box-shadow:0 0 0 2px #c4cda7a9,0 6px 17px #433c211e;flex-shrink:0}
.story-progress-ring:before{height:70px;width:70px;background:#f8f3e5}
.story-progress-ring .ring-number{font:500 28px Georgia,serif;white-space:nowrap;color:#2b4633}
.story-progress-ring .ring-number small{font-size:13px}
.story-progress-note{min-width:0;color:#5f6553;font-size:14px;line-height:1.4;max-width:158px;background:linear-gradient(90deg,#fff8ebe8,#fff8ebc9);padding:7px 8px 7px 7px;margin-left:-3px;border-radius:12px;backdrop-filter:blur(2px)}
.story-progress-note strong{font:500 23px/1.07 Georgia,serif;letter-spacing:-.3px;color:#294332;display:block;margin-bottom:7px}
.story-progress-note span{display:block;font-size:13px;color:#65695d}
.story-feature-cta{margin-top:auto;min-height:48px;border-radius:50px;padding:11px 20px;background:#365540;box-shadow:0 4px 12px #23382b38,0 0 0 2px #fbf2d2a8;white-space:normal;text-align:center;font:500 16px/1.25 Georgia,serif;letter-spacing:0}
.story-feature-cta .icon-svg{width:19px;height:19px}
.story-feature-cta:hover{background:#263e30}
.photo-yarrow-hit{position:absolute;z-index:3;right:0;top:14%;width:51%;height:80%;cursor:pointer;border:0;background:transparent;border-radius:36% 36% 20% 20%;touch-action:manipulation;outline-offset:-7px}
.photo-yarrow-hit:focus-visible{outline:3px solid #ffe6a3;background:#fcdfa412}
.photo-yarrow-hit.petting{animation:pet-photo .46s ease-in-out 2}
@keyframes pet-photo{50%{background:radial-gradient(circle at 47% 42%,#f8d89721,transparent 60%)}}
.photo-touch-hint{position:absolute;right:14px;bottom:12px;z-index:4;color:#f8e9d0;background:#1e2e24a4;backdrop-filter:blur(4px);font:italic 11px Georgia,serif;letter-spacing:.3px;border-radius:50px;padding:5px 9px;pointer-events:none}
.floating-motes{position:absolute;inset:0;pointer-events:none;z-index:3}
.floating-motes i{position:absolute;width:3px;height:3px;background:#ffedbd;box-shadow:0 0 10px 3px #ffe7a977;border-radius:50%;animation:storybook-mote 6s ease-in-out infinite}
.floating-motes i:nth-child(1){left:68%;top:25%;animation-delay:-1s}.floating-motes i:nth-child(2){left:85%;top:49%;animation-delay:-4s}.floating-motes i:nth-child(3){left:74%;top:72%;animation-delay:-2s}.floating-motes i:nth-child(4){left:55%;top:38%;animation-delay:-3s}
@keyframes storybook-mote{0%,100%{opacity:.12;transform:translate(0,4px)}50%{opacity:.85;transform:translate(4px,-13px)}}
@keyframes story-warmth{0%,100%{filter:saturate(.96) brightness(1)}50%{filter:saturate(1.03) brightness(1.055)}}
.moon-feature{min-height:440px;display:flex;align-items:end;background:#c0aa85}
.mirror-photo{inset:0;width:100%;background-image:var(--moon-real-art);background-position:54% center}
.moon-feature:before{content:'';position:absolute;z-index:1;inset:0;background:linear-gradient(90deg,#f7edd8 0%,#f7edd8e5 33%,#f7edd8a1 53%,transparent 79%);pointer-events:none}
.mirror-feature-content{position:relative;z-index:4;padding:27px;max-width:75%;width:100%;display:flex;flex-direction:column;align-items:start;gap:12px}
.mirror-feature-content .story-feature-title{margin:0;font-size:clamp(31px,3.1vw,40px)}
.story-ornament{display:block;color:#b88c51;font:24px/1 Georgia,serif}
.mirror-story-question{font:italic 23px/1.25 Georgia,serif;color:#385644;letter-spacing:-.3px;margin:0;max-width:260px}
.mirror-feature-content .story-feature-cta{margin-top:5px}
.storybook-actions{grid-template-columns:repeat(4,minmax(0,1fr));margin-top:17px;gap:13px}
.storybook-actions .action-tile{background:linear-gradient(135deg,#fff9ee,#f5eedf);border-color:#d7c2a0;box-shadow:0 6px 13px #80644317;min-height:120px}
.storybook-actions .action-tile strong{font-family:Georgia,serif;color:#334d3a;font-weight:500}
.storybook-actions .action-tile small{line-height:1.35}
.storybook-actions .round-icon{border:1px solid #cfceb1;background:#e9ecd9;color:#3c604b}
.storybook-actions .action-tile:nth-child(2) .round-icon{background:#f1e5c9;color:#9b7652}
.rituals-view .ritual-row,.grimoire-view .card,.cottage-view .card,.yarrow-view .card{box-shadow:0 4px 13px #846d4a18;border-color:#d9c6a9}
.rituals-view .ritual-row:not(.completed){background:linear-gradient(112deg,#fffaf0,#f7ecdc)}
.grimoire-view .journal-editor{background:linear-gradient(145deg,#fff9ea,#f8ead5)}
.cottage-view .garden-board{background:radial-gradient(ellipse at top,#f2f0d5,#d3dfb2 54%,#aabd92)}
@media(max-width:1190px){
 .storybook-feature-grid{grid-template-columns:1fr;gap:14px}
 .today-feature{min-height:425px}
 .moon-feature{min-height:260px}
 .mirror-photo{width:77%;left:auto;right:0;background-size:cover;background-position:center}
 .moon-feature:before{background:linear-gradient(90deg,#f7edd8 0%,#f7edd8ee 28%,#f7edd8ac 51%,transparent 85%)}
 .mirror-feature-content{max-width:58%;padding:28px 30px}
 .hero-photo{width:64%;background-position:9% 48%}
 .today-feature-content{width:60%}
 .storybook-actions{grid-template-columns:repeat(2,minmax(0,1fr))}
}
@media(max-width:700px){
 .main-area{padding:17px 13px calc(102px + env(safe-area-inset-bottom))}
 .topbar{padding:0 14px;background:#fbf7eaed}
 .brand-title{font-size:clamp(19px,5.6vw,24px);letter-spacing:-1.1px}
 .brand-tagline{font-size:8px;letter-spacing:1.35px}
 .brand-mark{width:44px;height:44px}
 .hearth-reimagined .whisper-ribbon{min-height:70px;padding:12px 32px 9px;margin:2px 5px 15px;border-radius:18px}
 .whisper-eyebrow{font-size:9px;letter-spacing:1.9px}
 .whisper-ribbon p{font-size:clamp(16px,4vw,20px);line-height:1.24;letter-spacing:-.25px}
 .whisper-ribbon .whisper-star{font-size:12px;margin-top:3px}
 .whisper-flower{font-size:48px;opacity:.27;bottom:-12px}
 .storybook-feature-grid{gap:13px}
 .storybook-feature{border-radius:19px}
 .today-feature{min-height:390px}
 .hero-photo{width:66%;background-position:8% 45%}
 .story-art-glow{background:linear-gradient(90deg,#fff8e9 0%,#fff8e9f8 27%,#fff8e9db 42%,#fff8e98c 58%,transparent 78%)}
 .today-feature-content{padding:23px 10px 19px 21px;width:61%}
 .story-feature-title{font-size:clamp(31px,8.2vw,40px);letter-spacing:-1.1px;margin-bottom:12px}
 .story-petals{font-size:11px;padding:5px 10px}
 .story-progress-row{gap:12px;margin:24px 0 16px}
 .story-progress-ring{width:76px;height:76px}
 .story-progress-ring:before{width:57px;height:57px}
 .story-progress-ring .ring-number{font-size:24px}
 .story-progress-ring .ring-number small{font-size:10px}
 .story-progress-note strong{font-size:20px;line-height:1.05}
 .story-progress-note span{font-size:11px;line-height:1.28;margin-top:5px}
 .story-feature-cta{font-size:14px;min-height:44px;padding:9px 13px}
 .photo-touch-hint{font-size:9px;right:9px;bottom:8px}
 .moon-feature{min-height:218px}
 .mirror-photo{width:78%;background-position:55% center}
 .mirror-feature-content{max-width:67%;padding:18px 15px 18px 22px;gap:9px}
 .mirror-feature-content .story-feature-title{font-size:clamp(28px,7.1vw,36px);line-height:1.02}
 .mirror-story-question{font-size:clamp(15px,4.4vw,20px);line-height:1.21}
 .mirror-feature-content .story-feature-cta{font-size:13px;min-height:40px;padding:7px 12px}
 .story-ornament{display:none}
 .storybook-actions{grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin-top:13px}
 .storybook-actions .action-tile{display:grid;grid-template-columns:43px minmax(0,1fr);grid-template-rows:auto auto;align-content:center;column-gap:9px;row-gap:1px;min-height:105px;padding:12px 11px}
 .storybook-actions .round-icon{grid-row:1 / span 2;height:38px;width:38px}
 .storybook-actions .round-icon .icon-svg{height:21px;width:21px}
 .storybook-actions .action-tile strong{font-size:17px;line-height:1.05;align-self:end}
 .storybook-actions .action-tile small{font-size:11px;line-height:1.24;align-self:start;margin-top:3px}
 .storybook-actions .action-tile:after{font-size:19px;right:7px;top:3px}
 .mobile-nav-link{font-size:10px}
}
@media(max-width:390px){
 .today-feature{min-height:405px}
 .today-feature-content{width:64%;padding-left:18px}
 .story-progress-row{gap:8px}
 .story-progress-ring{width:70px;height:70px}
 .story-progress-ring:before{width:54px;height:54px}
 .story-progress-note strong{font-size:18px}
 .story-progress-note span{font-size:10px}
 .mirror-feature-content{max-width:70%}
 .story-feature-cta{font-size:13px}
}
@media(max-width:340px){
 .brand-tagline{letter-spacing:.5px}.topbar-actions{gap:4px}.header-icon-btn{width:34px;height:34px}
 .today-feature{min-height:416px}
 .today-feature-content{width:69%;padding-left:14px}
 .story-feature-title{font-size:28px}
 .mirror-feature-content{max-width:76%;padding-left:14px}
 .storybook-actions .action-tile{padding:9px 7px;column-gap:6px}
 .storybook-actions .action-tile strong{font-size:14px}
}
@media(prefers-reduced-motion:reduce){.hero-photo,.floating-motes i,.photo-yarrow-hit{animation:none!important}}
body.motion-off .hero-photo,body.motion-off .floating-motes i,body.motion-off .photo-yarrow-hit{animation:none!important}

.hearth-world{position:relative;isolation:isolate;min-height:390px;overflow:hidden;border:1px solid #c1a371;border-radius:25px;box-shadow:0 0 0 3px #fbf2de,0 0 0 4px #bda272,0 13px 30px #382d1f30;background:#8b7450;margin:7px 3px 20px}
.hearth-world .living-room{position:absolute;inset:0;background-image:var(--living-hearth);background-size:cover;background-position:center;filter:contrast(1.02) saturate(1.12);transform:scale(1.025)}
.hearth-world:before{content:'';position:absolute;inset:0;z-index:1;background:linear-gradient(180deg,#e8d9b638 0%,transparent 34%,transparent 66%,#2c2619c7 100%),radial-gradient(ellipse at 53% 40%,#ffe0a21d,transparent 67%);pointer-events:none}
.hearth-world:after{content:'';pointer-events:none;position:absolute;z-index:11;inset:5px;border:1px solid #e8c9879e;border-radius:19px;box-shadow:inset 0 0 45px #21191330}
.hearth-world .hearth-light{position:absolute;z-index:2;inset:0;background:radial-gradient(ellipse at 50% 15%,#fff3bd99 0%,#ffe3a02b 43%,transparent 74%);pointer-events:none;animation:hearth-light-breath 8s ease-in-out infinite alternate}
.hearth-world[data-time="night"] .living-room{filter:brightness(.69) saturate(1.08)}
.hearth-world[data-time="night"] .hearth-light{background:radial-gradient(ellipse at 52% 26%,#fff0c158,transparent 65%)}
.hearth-world[data-time="dusk"] .hearth-light{background:radial-gradient(ellipse at 52% 26%,#f6b66568,transparent 65%)}
.hearth-world .hearth-stage-label{position:absolute;top:16px;left:19px;z-index:8;border:1px solid #ddc59a9c;border-radius:12px;background:#f9eed5d9;box-shadow:0 3px 12px #46341d32;padding:8px 12px;max-width:66%;color:#35503d;text-align:left;backdrop-filter:blur(7px)}
.hearth-stage-label small{display:block;color:#886b44;text-transform:uppercase;font:700 9px/1.5 sans-serif;letter-spacing:1.35px}
.hearth-stage-label strong{display:block;font:italic 17px/1.25 Georgia,serif}
.hearth-world .yarrow-perch{position:absolute;z-index:2;bottom:-13px;left:4%;width:92%;height:52px;border-top:9px solid #b4905e;border-radius:50% 50% 0 0;box-shadow:0 -8px 18px #f5ce7a25,0 12px 28px #23180d75;background:linear-gradient(#6b4830,#3b2b21)}
.yarrow-puppet{position:absolute;display:block;z-index:6;padding:0;border:0;background:none;outline-offset:-4px;cursor:pointer;touch-action:manipulation;width:260px;height:384px;max-width:none;filter:drop-shadow(0 16px 17px #24190e63);-webkit-tap-highlight-color:transparent}
.yarrow-puppet:focus-visible{outline:3px solid #ffdb88;outline-offset:-7px;border-radius:22px}
.yarrow-puppet .yarrow-sprite{position:absolute;inset:0;display:block;background-image:var(--yarrow-atlas);background-size:400% 200%;background-position:var(--sprite-x,0%) var(--sprite-y,0%);background-repeat:no-repeat;opacity:0;pointer-events:none;transform-origin:50% 85%;transition:opacity .26s ease-in-out}
.yarrow-puppet .yarrow-sprite.is-active{opacity:1;animation:yarrow-breathe 3.8s ease-in-out infinite}
.yarrow-puppet[data-pose="purr"] .yarrow-sprite.is-active{animation:yarrow-cuddle .5s ease-in-out infinite alternate}
.yarrow-puppet[data-pose="knead"] .yarrow-sprite.is-active{animation:yarrow-knead .5s ease-in-out infinite alternate}
.yarrow-puppet[data-pose="stretch"] .yarrow-sprite.is-active{animation:yarrow-stretch 1.4s ease-in-out 1}
.yarrow-puppet[data-pose="walk"] .yarrow-sprite.is-active{animation:yarrow-walk 1.4s ease-in-out 1}
.yarrow-puppet[data-pose="tilt"] .yarrow-sprite.is-active{animation:yarrow-curiosity 1.1s ease-in-out 1}
.yarrow-puppet[data-pose="swish"] .yarrow-sprite.is-active{animation:yarrow-tail 1.1s ease-in-out 1}
.yarrow-puppet[data-pose="blink"] .yarrow-sprite.is-active{animation:yarrow-blink .85s ease-in-out 1}
.yarrow-puppet .yarrow-touch-glint{position:absolute;left:52%;top:23%;width:9px;height:9px;border-radius:100%;background:#f6d88e;box-shadow:0 0 7px 4px #ffda99bd;opacity:0;pointer-events:none}
.yarrow-puppet[data-pose="purr"] .yarrow-touch-glint{animation:yarrow-sparkle 1.2s ease-out infinite}
.yarrow-puppet.hearth-character{bottom:-4px;left:50%;transform:translateX(-50%);width:min(66vw,258px);height:min(97vw,383px)}
.yarrow-puppet.profile-character{position:relative;width:min(76vw,300px);height:min(112vw,442px);margin:0 auto;max-height:440px;max-width:300px}
.yarrow-puppet.profile-character .yarrow-sprite{transform-origin:50% 85%}
.hearth-world .hearth-world-bottom{position:absolute;z-index:9;bottom:12px;left:15px;right:15px;display:flex;justify-content:space-between;align-items:end;gap:9px;pointer-events:none;color:#fff4d6;font:italic 13px Georgia,serif;text-shadow:0 2px 4px #1115}
.hearth-world-bottom .yarrow-invite{border-radius:30px;padding:5px 10px;background:#203629a8;border:1px solid #d4b37c7a;white-space:nowrap;backdrop-filter:blur(6px);font-size:12px}
.hearth-world .hearth-mote{position:absolute;z-index:3;width:3px;height:3px;border-radius:50%;background:#f9dd99;box-shadow:0 0 12px 4px #ffdb976c;animation:hearth-wander var(--dur,7s) ease-in-out infinite;left:var(--mx,20%);top:var(--my,30%);pointer-events:none}

    merged.rituals = Array.isArray(raw.rituals) ? raw.rituals.slice(0,80).filter(r=>r&&typeof r.id==='string'&&typeof r.title==='string').map(r=>({id:r.id.slice(0,60),title:r.title.slice(0,90),area:CATEGORIES.includes(r.area)&&r.area!=='All'?r.area:'Mind',hint:typeof r.hint==='string'?r.hint.slice(0,150):''})) : base.rituals;
    merged.logs = raw.logs && typeof raw.logs === 'object' && !Array.isArray(raw.logs) ? raw.logs : {};
    merged.awards = raw.awards && typeof raw.awards === 'object' && !Array.isArray(raw.awards) ? raw.awards : {};
    merged.petals = Number.isFinite(raw.petals)? Math.max(0,Math.min(1000000,Math.floor(raw.petals))) : base.petals;
    merged.friendship = Number.isFinite(raw.friendship)? Math.max(0,Math.min(1000000,Math.floor(raw.friendship))) : 0;
    merged.totalMagic = Number.isFinite(raw.totalMagic)? Math.max(0,Math.min(1000000,Math.floor(raw.totalMagic))) : 0;
    merged.checkins = Array.isArray(raw.checkins) ? raw.checkins.filter(m=>m&&typeof m.date==='string'&&MOODS.some(x=>x.id===m.mood)).slice(-1000).map(m=>({date:m.date.slice(0,10),mood:m.mood,note:String(m.note||'').slice(0,1000)})) : [];
    merged.journal = Array.isArray(raw.journal) ? raw.journal.slice(0,3000).filter(e=>e&&typeof e.id==='string').map(e=>({id:e.id.slice(0,60),date:String(e.date||'').slice(0,30),prompt:String(e.prompt||'').slice(0,150),text:String(e.text||'').slice(0,10000)})) : [];
    merged.outfitsOwned = Array.isArray(raw.outfitsOwned)? [...new Set(raw.outfitsOwned.filter(x=>OUTFITS.some(i=>i.id===x)).concat('crescent'))] : base.outfitsOwned;
    merged.outfit = merged.outfitsOwned.includes(raw.outfit)?raw.outfit:'crescent';
    merged.decorOwned = Array.isArray(raw.decorOwned)?[...new Set(raw.decorOwned.filter(x=>DECOR.some(i=>i.id===x)).concat('fern'))] : base.decorOwned;
    merged.decorVisible = Array.isArray(raw.decorVisible)?raw.decorVisible.filter(x=>merged.decorOwned.includes(x)) : base.decorVisible;
    merged.garden = Array.isArray(raw.garden)?Array.from({length:6},(_,i)=>{const p=raw.garden[i];return p&&PLANTS.some(plant=>plant.id===p.plant)?{plant:p.plant,growth:Math.max(0,Math.min(4,Math.floor(Number(p.growth)||0)))}:null;}):base.garden;
    merged.herbarium = raw.herbarium && typeof raw.herbarium==='object' && !Array.isArray(raw.herbarium) ? Object.fromEntries(PLANTS.map(p=>[p.id,Math.max(0,Math.min(10000,Math.floor(Number(raw.herbarium[p.id])||0)))])) : {};
    merged.petToday = raw.petToday && typeof raw.petToday==='object' && !Array.isArray(raw.petToday)?raw.petToday:{};
    merged.gratitudeJar = Array.isArray(raw.gratitudeJar) ? raw.gratitudeJar.slice(-100).filter(x=>x&&typeof x.text==='string').map(x=>({id:String(x.id||'').slice(0,60),date:String(x.date||'').slice(0,30),text:x.text.slice(0,280)})) : [];
    merged.seasonalReflection = typeof raw.seasonalReflection==='string' ? raw.seasonalReflection.slice(0,500) : '';
    merged.sound = typeof raw.sound==='boolean'?raw.sound:true;
    merged.animation = typeof raw.animation==='boolean'?raw.animation:true;
    merged.timePreference = ['auto','dawn','day','dusk','night'].includes(raw.timePreference)?raw.timePreference:'auto';
    return merged;
  }
  function loadState() {
    try { return normalize(JSON.parse(localStorage.getItem(STORAGE_KEY))); }
    catch { return makeDefault(); }
  }
  function save() {
    try { localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); return true; }
    catch { toast('Your browser is not allowing local saving. Please export a backup.'); return false; }
  }
  function toast(message) {
    clearTimeout(toastTimer); toastEl.textContent = message; toastEl.classList.add('show');
    toastTimer = setTimeout(()=>toastEl.classList.remove('show'),3000);
  }
  function todayDone() {
    const done = state.logs[todayKey()];
    return Array.isArray(done)?done.filter(id=>state.rituals.some(r=>r.id===id)):[];
  }
  function isDone(id){return todayDone().includes(id);}
  function stageName(){const n=state.friendship;return n<5?'New acquaintances':n<15?'Growing trust':n<35?'Kindred spirits':n<70?'Dear companions':'Forever familiars';}

  function pageTitle(kicker, heading, sub, extra='') {
    return `<div class="section-intro"><div><p class="kicker">${esc(kicker)}</p><h1 class="page-title">${heading}</h1>${sub?`<p class="page-subtitle">${sub}</p>`:''}</div>${extra}</div>`;
  }
  /* v2.0: Retired the old monolithic photo and triangular-mesh fallback.
     Yarrow is authored once as a jointed SVG, and always uses that rig. */
  const YARROW_MOTIONS=new Set(['idle','blink','tilt','swish','knead','offer','purr','happy']);
  let yarrowSceneController=null;
  let yarrowIdleTimer=null;

  function outfitArt() {
    switch(state.outfit) {
      case 'flowers': return `<g fill="#f6e4b1" stroke="#a28d55" stroke-width="1.3" stroke-linecap="round">
        <path d="M143 173Q207 119 285 138" fill="none" stroke="#557854" stroke-width="6"/>
        ${[[151,169],[185,150],[220,139],[255,137],[280,145]].map(([x,y])=>`<g transform="translate(${x} ${y})"><ellipse ry="12" rx="5"/><ellipse ry="12" rx="5" transform="rotate(60)"/><ellipse ry="12" rx="5" transform="rotate(120)"/><circle r="5" fill="#d5a551" stroke="none"/></g>`).join('')}</g>`;
      case 'scarf': return `<g><path d="M149 284Q218 311 311 266L319 294Q253 341 175 310Z" fill="#9d5b42" stroke="#e1b78a" stroke-width="3"/><path d="M211 309q14 48 1 81l-19-8 2-72" fill="#9d5b42" stroke="#d5a579" stroke-width="3"/><path d="M208 320l-7 55m18-52-3 41" stroke="#f2d2a4" opacity=".46" stroke-width="2"/></g>`;
      case 'hat': return `<g><path d="M162 136Q214 84 258 7Q260 82 312 155Z" fill="#385143" stroke="#bca175" stroke-width="5"/><path d="M157 130Q232 112 312 140l-9 15Q229 134 167 153Z" fill="#344938" stroke="#c6a56b" stroke-width="5"/><path d="M200 113q48 9 69 4" stroke="#cfae73" fill="none" stroke-width="8"/><path d="M238 116l7-11 7 12-7 11Z" fill="#d5ad72"/></g>`;
      case 'satchel': return `<g><path d="M177 305q58 45 132 104" stroke="#a88959" fill="none" stroke-width="8" opacity=".87"/><path d="M284 388l60 13-5 69-76-9Z" fill="#73603b" stroke="#c4a87a" stroke-width="5"/><path d="M283 391l58 12-12 29-60-12Z" fill="#8c7347" stroke="#d1af78" stroke-width="3"/><circle cx="307" cy="420" r="5" fill="#e1c583"/></g>`;
      default:return '';
    }
  }
  function capeArt() {
    return state.outfit==='cape'?`<g><path d="M146 301Q109 309 66 410L81 483Q201 528 340 455L344 355Q321 293 297 284q-75 32-151 17Z" fill="#405e4b" stroke="#9da77c" stroke-width="5" opacity=".95"/><path d="M106 441q91 47 207 10" stroke="#b3ba8e" fill="none" stroke-width="3" opacity=".6"/></g>`:'';
  }
  function renderAnimatedYarrow(place='hearth') {
    // Same authored familiar in every view; preserve wardrobe and mood-based pace.
    return window.YarrowCutout.render({
      place,
      outfit:state.outfit,
      sleepy:['night','dusk'].includes(timeOfDay()),
      comforting:!!state.checkins.find(m=>m.date===todayKey()&&['rainy','cloudy','windy','tender'].includes(m.mood))
    });
  }
  function yarrowCanAnimate(){return state.animation&&!window.matchMedia('(prefers-reduced-motion: reduce)').matches;}
  function createYarrowScene(){
    const puppet=document.querySelector('.yarrow-puppet.cutout-yarrow');
    return puppet&&yarrowCanAnimate()?window.YarrowCutout.mount(puppet):null;
  }
  function setupYarrowScene(){
    yarrowSceneController?.dispose();yarrowSceneController=null;
    if(document.querySelector('.yarrow-puppet.cutout-yarrow'))yarrowSceneController=createYarrowScene();
  }
  function setYarrowPose(pose='idle',duration=1550,force=false){
    if(!YARROW_MOTIONS.has(pose)||!document.querySelector('.yarrow-puppet'))return false;
    if(!yarrowCanAnimate()&&!force)return false;
    const puppet=document.querySelector('.yarrow-puppet');
    if(yarrowSceneController?.ready)return yarrowSceneController.pose(pose,duration);
    puppet.dataset.pose=pose;return false;
  }
  function startYarrowLife(){
    if(yarrowIdleTimer)return;
    yarrowIdleTimer=window.setInterval(()=>{
      if(document.hidden||!yarrowCanAnimate()||(view!=='hearth'&&view!=='yarrow'&&view!=='cottage'))return;
      const scene=yarrowSceneController;if(!scene||!scene.ready||scene.action!=='idle')return;
      const poses=['blink','tilt','swish','blink','blink','knead'];
      const pose=poses[Math.floor(Math.random()*poses.length)];
      setYarrowPose(pose,pose==='knead'?2650:pose==='tilt'?1400:900);
    },11800);
  }

  function yarrowMomentButtons() {

  function plantDrawing(p, growth) {
    const height=14+growth*14;let leaves='';
    for(let i=0;i<growth*2+1;i++){
      const y=87-i*(height/(growth*2+2))-8;
      const side=i%2===0?-1:1;
      const x=45+side*(8+i%3*2);
      leaves += `<ellipse cx="${x}" cy="${y}" rx="${growth>=3?11:8}" ry="${growth>=3?5.5:4}" fill="${p.leaf}" transform="rotate(${side*29} ${x} ${y})"/>`;
    }
    let blooms='';
    if(growth>=4){for(let i=0;i<4;i++){const x=32+i*9,y=20+((i*7)%10); blooms+=`<g><circle cx="${x}" cy="${y}" r="6" fill="${p.bloom}"/><circle cx="${x}" cy="${y}" r="2" fill="#d9ad5c"/></g>`;}}
    return `<svg viewBox="0 0 90 112" aria-hidden="true"><ellipse cx="45" cy="99" rx="29" ry="8" fill="#516343" opacity=".22"/><path d="M25 85h40l-5 22H30Z" fill="#aa7959" stroke="#81573f" stroke-width="2"/><ellipse cx="45" cy="84" rx="21" ry="5" fill="#5d5d42"/><path d="M45 86Q${growth>=3?'40':'48'} ${77-growth*8} 45 ${85-height}" stroke="${p.stem}" stroke-width="3" fill="none" stroke-linecap="round"/>${leaves}${blooms}</svg>`;
  }

  function playPurr(duration=1) {
    if(!state.sound)return;
    try {
      const AC=window.AudioContext||window.webkitAudioContext;
      if(!AC)return;
      audioContext=audioContext||new AC();
      if(audioContext.state==='suspended')audioContext.resume().catch(()=>{});
      const now=audioContext.currentTime;
      const master=audioContext.createGain();master.gain.setValueAtTime(0,now);master.gain.linearRampToValueAtTime(.055,now+.08);master.gain.setValueAtTime(.055,now+duration-.12);master.gain.linearRampToValueAtTime(0,now+duration);
      master.connect(audioContext.destination);
      const mod=audioContext.createOscillator(),modGain=audioContext.createGain();mod.type='sine';mod.frequency.value=24;modGain.gain.value=.026;mod.connect(modGain);
      const o=audioContext.createOscillator(),g=audioContext.createGain();o.type='triangle';o.frequency.setValueAtTime(93,now);o.frequency.linearRampToValueAtTime(107,now+duration);g.gain.value=.45;modGain.connect(g.gain);o.connect(g);g.connect(master);
      const high=audioContext.createOscillator(),hg=audioContext.createGain();high.type='sine';high.frequency.value=162;hg.gain.value=.09;high.connect(hg);hg.connect(master);
      mod.start(now);o.start(now);high.start(now);mod.stop(now+duration);o.stop(now+duration);high.stop(now+duration);
      setTimeout(()=>{try{mod.disconnect();o.disconnect();high.disconnect();master.disconnect()}catch{}},Math.ceil((duration+0.15)*1000));
    } catch { /* Some phones mute Web Audio; visual feedback still works. */ }
  }

  function gardenPlot(i) {
    const plot=state.garden[i];if(i<0||i>=6)return;
    if(plot){const p=PLANTS.find(x=>x.id===plot.plant);if(!p)return;
      openModal(`<span class="eyebrow">Garden patch ${i+1}</span><h2>${p.emoji} ${p.name}</h2><p>${plot.growth===4?'This little herb is ready to be gathered!':'A little patience and kindness will help it grow.'}</p><div class="progress-track" style="margin:22px 0"><div class="progress-fill" style="width:${plot.growth*25}%"></div></div><p>${plot.growth} of 4 growing moments</p><div class="form-actions"><button type="button" class="btn btn-secondary" data-action="close-modal">Leave it growing</button>${plot.growth===4?`<button type="button" class="btn btn-primary" data-action="harvest" data-index="${i}">${icon('leaf')} Harvest (+6 petals)</button>`:''}</div>`,'narrow');return;
    }
    openModal(`<span class="eyebrow">Plant a little beginning</span><h2>Choose a seed for plot ${i+1}</h2><p>Each seed grows with your daily rituals. Nothing will ever wilt while you are away.</p><div class="shop-grid" style="margin:19px 0">${PLANTS.map(p=>`<div class="shop-item"><span class="shop-emoji">${p.emoji}</span><strong>${p.name}</strong><small>Seed packet</small><button type="button" class="btn btn-primary btn-small" data-action="plant" data-index="${i}" data-id="${p.id}" ${state.petals<p.cost?'disabled':''}>${p.cost} petals</button></div>`).join('')}</div><span class="pill gold">✿ ${state.petals} petals in your pouch</span>`,'wide');
  }
  function plant(i,id) {
    const p=PLANTS.find(x=>x.id===id);if(!p||state.garden[i]||i<0||i>=6)return;
    if(state.petals<p.cost)return;
    state.petals-=p.cost;state.garden[i]={plant:p.id,growth:0};save();closeModal();render();toast(`${p.name} planted! One small beginning. ❧`);
  }
  function harvest(i) {
    const plot=state.garden[i];if(!plot||plot.growth!==4)return;
    state.herbarium[plot.plant]=(state.herbarium[plot.plant]||0)+1;
    state.garden[i]=null;state.petals+=6;save();closeModal();render();toast('A lovely little harvest! +6 petals ❧');
  }
  function openChapter(i) {
    const ch=CHAPTERS[i];if(!ch||state.friendship<ch.need)return;
    openModal(`<span class="eyebrow">Yarrow’s Storybook · Chapter ${i+1}</span><h2>${esc(ch.title)}</h2><p style="font:16px/1.95 Georgia,serif;color:#526b56;white-space:pre-wrap;margin:20px 0">${esc(ch.text)}</p><div class="form-actions"><button class="btn btn-primary" type="button" data-action="close-modal">Close the book ${icon('book')}</button></div>`,'wide');
  }
  function startBreathing() {
    const orb=document.getElementById('breath-orb');if(!orb)return;
    breathStart=Date.now();orb.classList.add('running');
    const btn=document.getElementById('breath-btn');if(btn){btn.innerHTML=`${icon('x')} Stop for now`;btn.setAttribute('aria-pressed','true');}
    breathTimer=setInterval(()=>{
      const t=((Date.now()-breathStart)/1000)%14;
      const phase=t<4?'Breathe in':t<8?'Hold softly':'Breathe out';
      const el=document.getElementById('breath-phase');if(el)el.textContent=phase;
      const info=document.getElementById('breath-info');if(info)info.textContent=`${phase} · ${Math.max(1,Math.ceil((t<4?4:t<8?8:14)-t))} seconds`;
    },150);
  }
  function stopBreathing(){if(breathTimer){clearInterval(breathTimer);breathTimer=null;}const orb=document.getElementById('breath-orb');orb?.classList.remove('running');const ph=document.getElementById('breath-phase');if(ph)ph.textContent='Be here';const btn=document.getElementById('breath-btn');if(btn){btn.innerHTML=`${icon('spark')} Begin a breath`;btn.setAttribute('aria-pressed','false');}const info=document.getElementById('breath-info');if(info)info.textContent='Breathe in 4 · hold 4 · breathe out 6';}
  function exportBackup() {
    try {
      const text=JSON.stringify({...state,version:1,exportedAt:new Date().toISOString()},null,2);
      const blob=new Blob([text],{type:'application/json'});
      const url=URL.createObjectURL(blob);
      const link=document.createElement('a');link.href=url;link.download=`a-whisker-a-day-backup-${todayKey()}.json`;document.body.append(link);link.click();link.remove();setTimeout(()=>URL.revokeObjectURL(url),3000);
      toast('Your little world is ready to keep safe.');
    }catch{toast('Could not create a backup. Please try another browser.');}
  }
  async function importBackup(file) {
    if(!file)return;
    if(file.size>2*1024*1024){toast('That backup is larger than expected (max 2 MB).');return;}
    try {
      const raw=JSON.parse(await file.text());
      if(!raw||raw.version!==1||!Array.isArray(raw.rituals)||!Array.isArray(raw.journal))throw Error('Invalid backup');
      if(!window.confirm('Restore this backup? It will replace the progress saved in this browser. Download a current backup first if you need it.'))return;
      state=normalize(raw);save();closeModal();render();toast('Your little world has been restored. Welcome home.');
    }catch{toast('This file is not a valid A Whisker a Day backup.');}
  }
  function resetAll() {
    if(!window.confirm('Clear everything saved by A Whisker a Day on this device? This cannot be undone without a downloaded backup.'))return;
    if(!window.confirm('One last check: erase rituals, journal entries, garden and Yarrow’s progress?'))return;
    state=makeDefault();journalDraft='';journalEditingId=null;save();closeModal();view='hearth';render();toast('A fresh little page, whenever you are ready.');
  }
  function rolloverIfNeeded() {const key=todayKey();if(key===lastDateKey)return;lastDateKey=key;render();toast('A new day, a fresh page. Nothing lost.');}
  function bindEvents() {
    document.addEventListener('click',(event)=>{
      const nav=event.target.closest('[data-nav]');if(nav){changeView(nav.dataset.nav);return;}
      if(event.target.matches('[data-backdrop]')){closeModal();return;}
      const category=event.target.closest('[data-filter]');if(category){filter=category.dataset.filter;render();return;}
      const tab=event.target.closest('[data-cottage-tab]');if(tab){cottageTab=tab.dataset.cottageTab;render();return;}
      const btn=event.target.closest('[data-action]');if(!btn)return;
      const action=btn.dataset.action,id=btn.dataset.id,i=Number(btn.dataset.index);
      switch(action){
        case 'mirror':openMirror();break;
        case 'settings':openSettings();break;
        case 'close-modal':closeModal();break;
        case 'add-ritual':editRitualModal();break;
        case 'toggle-library':ritualLibraryOpen=!ritualLibraryOpen;render();break;
        case 'add-library-ritual':{
          const template=RITUAL_LIBRARY.find(r=>r.id===id);
          if(!template||state.rituals.some(r=>r.id===id))break;
          if(state.rituals.length>=80){toast('Your ritual list is full (80 maximum).');break;}
          state.rituals.push({...template});save();render();toast('A new ritual has joined your daily tending.');break;
        }
        case 'toggle-ritual':toggleRitual(id);break;
        case 'delete-ritual':{
          const r=state.rituals.find(x=>x.id===id);if(r&&window.confirm(`Remove “${r.title}” from your daily rituals? Your other progress will stay.`)){state.rituals=state.rituals.filter(x=>x.id!==id);save();render();toast('Ritual removed from your daily page.');}break;}
        case 'choose-mood':moodDraft.note=document.getElementById('mood-note')?.value||'';moodDraft.mood=id;drawMirror();break;
        case 'pet-yarrow':petYarrow(btn);break;
        case 'yarrow-motion':{
          const pose=btn.dataset.pose||'blink';
          const motionMs=pose==='offer'?2050:pose==='knead'?3150:1500;
          setYarrowPose(pose,motionMs);
          document.querySelectorAll('.yarrow-moment').forEach(button=>button.setAttribute('aria-pressed',String(button===btn)));
          window.setTimeout(()=>{if(btn.isConnected)btn.setAttribute('aria-pressed','false');},motionMs);
          if(pose==='blink')toast('Yarrow gives you a little slow blink. ♡');
          if(pose==='knead')toast('Someone is making enchanted biscuits!');
          if(pose==='tilt')toast('Yarrow tilts her head to listen.');
          if(pose==='offer')toast('Yarrow offers you one soft little paw.');
          if(pose==='swish')toast('That tail has a mind of its own.');
          break;
        }
        case 'yarrow-gift':yarrowWisdom();break;
        case 'outfit':outfit(id);break;
        case 'decor':decor(id);break;
        case 'reward-moment':rewardMoment(id);break;
        case 'open-gratitude-jar':openGratitudeJar();break;
        case 'remove-gratitude':{
          if(!window.confirm('Remove this note from your gratitude jar?'))break;
          state.gratitudeJar=state.gratitudeJar.filter(note=>note.id!==id);
          save();render();toast('The note has been removed.');break;
        }
        case 'garden-plot':gardenPlot(i);break;
        case 'plant':plant(i,id);break;
        case 'harvest':harvest(i);break;
        case 'chapter':openChapter(i);break;
        case 'new-prompt':promptIndex=(promptIndex+1)%PROMPTS.length;render();break;
        case 'cancel-journal':journalDraft='';journalEditingId=null;render();break;
        case 'edit-journal':{const entry=state.journal.find(x=>x.id===id);if(entry){journalDraft=entry.text;journalEditingId=id;render();document.getElementById('journal-text')?.focus();window.scrollTo({top:0,behavior:'smooth'});}break;}
        case 'delete-journal':if(window.confirm('Remove this page from your grimoire?')){state.journal=state.journal.filter(x=>x.id!==id);save();render();toast('The page has been removed.');}break;
        case 'breath-toggle':breathTimer?stopBreathing():startBreathing();break;
        case 'toggle-sound':state.sound=!state.sound;save();btn.classList.toggle('on',state.sound);btn.setAttribute('aria-checked',String(state.sound));break;

    document.addEventListener('click',(event)=>{
      const topicButton=event.target.closest('[data-grimoire-topic]');
      if(!topicButton)return;
      grimoireTopic=topicButton.dataset.grimoireTopic;
      render();
    });
    document.addEventListener('submit',(event)=>{
      const f=event.target.closest('form[data-form]');if(!f)return;event.preventDefault();
      const type=f.dataset.form;
      if(type==='gratitude'){
        const note=f.querySelector('[name="gratitude"]')?.value.trim().slice(0,280);
        if(!note)return;
        state.gratitudeJar.push({id:uid(),date:new Date().toISOString(),text:note});
        state.gratitudeJar=state.gratitudeJar.slice(-100);
        gratitudeDraft='';save();render();toast('A little moment tucked into your jar.');return;
      }
      if(type==='seasonal-reflection'){
        state.seasonalReflection=f.querySelector('[name="seasonal"]')?.value.trim().slice(0,500)||'';
        seasonalDraft=null;save();render();toast('Your seasonal reflection is saved.');return;
      }
      if(type==='add-ritual'){
        const title=f.querySelector('[name="title"]').value.trim().slice(0,90);
        const area=f.querySelector('[name="area"]').value;
        const hint=f.querySelector('[name="hint"]').value.trim().slice(0,150);
        if(!title||state.rituals.length>=80){toast('Please give your ritual a name (up to 80 rituals).');return;}
        state.rituals.push({id:uid(),title,area:CATEGORIES.includes(area)?area:'Mind',hint:hint||'A little kindness, just for you.'});save();closeModal();filter='All';render();toast('Your new ritual has a place in the book.');
      }
      if(type==='journal'){
        const value=f.querySelector('[name="text"]').value.trim();if(!value)return;
        if(journalEditingId){const entry=state.journal.find(x=>x.id===journalEditingId);if(entry)entry.text=value.slice(0,10000);toast('Your page has been lovingly updated.');}
        else{state.journal.push({id:uid(),date:new Date().toISOString(),prompt:PROMPTS[promptIndex%PROMPTS.length],text:value.slice(0,10000)});toast('A little thought, safely tucked away.');}
        journalDraft='';journalEditingId=null;save();render();
      }
      if(type==='mood'){saveMood(f.querySelector('[name="note"]')?.value);}
    });
    document.addEventListener('input',(event)=>{if(event.target.id==='journal-text'){journalDraft=event.target.value;const counter=document.getElementById('journal-character-count');if(counter)counter.textContent=journalDraft.length.toLocaleString()+' / 10,000';const status=document.getElementById('journal-draft-indicator');if(status)status.textContent='Unfinished draft kept until you save or discard it.';}if(event.target.id==='gratitude-note')gratitudeDraft=event.target.value;if(event.target.id==='seasonal-note')seasonalDraft=event.target.value;if(event.target.id==='mood-note')moodDraft.note=event.target.value;});
    document.addEventListener('change',(event)=>{if(event.target.id==='import-file'){const file=event.target.files?.[0];importBackup(file);event.target.value='';}});
    document.addEventListener('keydown',(event)=>{
      if(event.key==='Escape'&&modalRoot.innerHTML){closeModal();return;}
      // Keep Tab navigation inside the currently open dialog.
      if(event.key==='Tab'&&modalRoot.innerHTML){const focusable=[...modalRoot.querySelectorAll('button:not([disabled]),input:not([disabled]):not([hidden]),textarea:not([disabled]),select:not([disabled]),a[href]')].filter(el=>el.getClientRects().length);if(!focusable.length)return;const first=focusable[0],last=focusable[focusable.length-1];if(event.shiftKey&&document.activeElement===first){event.preventDefault();last.focus();}else if(!event.shiftKey&&document.activeElement===last){event.preventDefault();first.focus();}}
    });
    document.addEventListener('visibilitychange',()=>{if(!document.hidden)rolloverIfNeeded();if(document.hidden&&breathTimer)stopBreathing();});
    window.addEventListener('focus',rolloverIfNeeded);
    window.setInterval(rolloverIfNeeded,60000);
  }
  function init() {
    document.querySelectorAll('[data-icon]').forEach(el=>{el.innerHTML=icon(el.dataset.icon)});
    bindEvents();render();startYarrowLife();
    if('serviceWorker' in navigator && (location.protocol==='https:'||location.hostname==='localhost'||location.hostname==='127.0.0.1')){
      window.addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').catch(()=>{}));
    }
  }
  init();
  window.__whiskerVersion = '2.4.0-dev';
})();
