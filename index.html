:root {
  --page: #ebe4d3; --paper:#fbf5e6; --paper-2:#f4ebd6; --paper-3:#e8dcc3;
  --ink:#354035; --muted:#74786a; --forest:#3f5948; --forest-deep:#283f33;
  --sage:#7f9270; --light-sage:#e3e8d9; --moss:#5c7152; --clay:#ab7958;
  --gold:#b38a4d; --dark-gold:#95703e; --border:#d8ceb7; --shadow:rgba(71,58,37,.1);
  --radius:19px; --ease:cubic-bezier(.22,.8,.28,1);
  font-synthesis:none; color-scheme:light;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth;-webkit-tap-highlight-color:transparent}
body{margin:0;color:var(--ink);background:var(--page);font:15px/1.55 'DM Sans','Trebuchet MS',sans-serif;min-height:100vh}
body:before{content:'';position:fixed;inset:0;pointer-events:none;z-index:-1;background:radial-gradient(ellipse at 10% 15%,#f9f3e5a3,transparent 43%),radial-gradient(ellipse at 98% 80%,#d4dbc5a3,transparent 35%)}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer;touch-action:manipulation} button:disabled{cursor:not-allowed;opacity:.48}
a{color:var(--forest);text-decoration-thickness:1px;text-underline-offset:3px}
button:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible,a:focus-visible{outline:3px solid #a07d3d;outline-offset:3px}
button,input,textarea,select{border-radius:10px}
svg{display:block}.icon-svg{width:21px;height:21px;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round;flex-shrink:0}
.hidden,[hidden]{display:none!important}
.skip-link{position:fixed;top:-100px;left:16px;z-index:999;background:var(--forest-deep);color:white;padding:8px 14px}
.skip-link:focus{top:12px}
.app-frame{max-width:1640px;margin:0 auto;min-height:100vh;background:linear-gradient(135deg,#f1ebdc 0%,#ebe5d7 70%);box-shadow:0 0 80px #483b251a}
.topbar{position:sticky;top:0;z-index:20;height:87px;display:flex;align-items:center;justify-content:space-between;padding:0 clamp(16px,3.4vw,48px);background:rgba(249,245,231,.94);backdrop-filter:blur(16px);border-bottom:1px solid #d8cbb2}
.brand{display:flex;align-items:center;gap:11px;text-align:left;background:transparent;border:0;padding:4px 0;color:var(--forest-deep)}
.brand-mark{width:54px;height:54px;filter:drop-shadow(0 4px 3px #3a432625)}
.brand-copy{display:flex;flex-direction:column;line-height:1.12}.brand-title{font-family:'Fraunces',Georgia,serif;font-weight:600;letter-spacing:-1.4px;font-size:clamp(20px,2.3vw,27px)}.brand-title i{font-style:italic;color:var(--clay)}
.brand-tagline{font-size:10px;letter-spacing:1.5px;color:#8c816c;text-transform:uppercase;margin-top:7px;font-weight:700}
.topbar-actions{display:flex;align-items:center;gap:11px}
.header-icon-btn{height:43px;width:43px;display:grid;place-items:center;border:1px solid var(--border);background:#f5eedf;color:var(--forest);border-radius:50%;transition:all .2s}.header-icon-btn:hover{background:#e9e7d4;transform:translateY(-2px)}.moon-top{font-family:Georgia,serif;font-size:30px;line-height:1}
.season-chip{border:1px solid #d3c9b1;border-radius:20px;padding:6px 13px;background:#eee8d5;font-size:11px;color:#786647;letter-spacing:.4px;white-space:nowrap}
.app-layout{display:grid;grid-template-columns:236px minmax(0,1fr);min-height:calc(100vh - 87px)}
.sidebar{border-right:1px solid #d6cbb4;background:linear-gradient(180deg,#ede8d7,#e5e4d0);padding:30px 13px 23px;position:sticky;top:87px;height:calc(100vh - 87px);display:flex;flex-direction:column;justify-content:space-between}
.eyebrow{font-size:10px;letter-spacing:2px;text-transform:uppercase;font-weight:700;color:var(--clay);margin:0}.eyebrow.muted{padding-left:17px;color:#8f927b;margin-bottom:17px}
.side-navigation{display:grid;gap:5px}.nav-link{border:1px solid transparent;background:transparent;width:100%;display:flex;align-items:center;gap:13px;text-align:left;padding:12px 15px;color:#647264;font-size:13px;font-weight:600;border-radius:12px;transition:.2s}.nav-link .icon-svg{width:20px;height:20px}.nav-link:hover{background:#f6efdf;color:var(--forest)}.nav-link.active{background:#f8f2e6;border-color:#d8cdb7;box-shadow:0 3px 8px #6f60421a;color:var(--forest-deep)}
.sidebar-bottom{padding:0 11px}.moon-note{display:flex;gap:10px;align-items:center;border-top:1px solid #cbc8b3;padding-top:17px;font-size:13px}.moon-note>div{display:flex;flex-direction:column}.moon-note-icon{font:36px Georgia;color:var(--gold)}.sidebar-quote{font-family:Georgia,serif;font-size:15px;font-style:italic;color:#78806b;line-height:1.4;margin:19px 0}.privacy-foot{font-size:10px;color:#8e8d7c}
.main-area{min-width:0;padding:30px clamp(16px,3.3vw,55px) 70px}
.view{max-width:1140px;margin:auto;animation:view-arrive .48s var(--ease) both}
@keyframes view-arrive{from{opacity:.01;transform:translateY(9px)}to{opacity:1;transform:translateY(0)}}
.section-intro{display:flex;justify-content:space-between;align-items:flex-end;gap:24px;margin:0 0 22px}.kicker{display:flex;align-items:center;gap:9px;color:var(--clay);font-size:11px;font-weight:700;letter-spacing:2px;text-transform:uppercase;margin:0 0 7px}.kicker:before{content:'✧';font-family:Georgia;font-size:18px;line-height:0}.page-title{font-family:'Fraunces',Georgia,serif;font-size:clamp(36px,4.5vw,57px);font-weight:500;letter-spacing:-2.2px;line-height:1.15;margin:0;color:#2f483b}.page-title em{font-style:italic;color:#9d774d}.page-subtitle{font-size:14px;color:var(--muted);max-width:680px;margin:10px 0 0}.date-ornament{color:#86775c;font-family:Georgia,serif;white-space:nowrap;font-size:15px;text-align:right}.date-ornament span{display:block;font:11px 'DM Sans',sans-serif;letter-spacing:1.5px;text-transform:uppercase;color:#92866f}
.card{background:var(--paper);border:1px solid var(--border);border-radius:var(--radius);box-shadow:0 9px 22px var(--shadow);overflow:hidden}.card-paper{background:linear-gradient(148deg,#fcf8eb,#f5eddd)}
.card-pad{padding:24px}.card-heading{font-family:'Fraunces',Georgia,serif;font-size:23px;font-weight:500;letter-spacing:-.55px;margin:0}.card-subtext{font-size:13px;color:var(--muted);margin:5px 0 0}
.tiny-leaf{color:#99a17f;font-family:Georgia,serif}.row-space{display:flex;align-items:center;justify-content:space-between;gap:14px}.row-center{display:flex;align-items:center;gap:10px}.section-heading{font-family:'Fraunces',Georgia,serif;font-size:26px;line-height:1.2;letter-spacing:-.8px;font-weight:500;margin:0 0 16px;color:#37503e}
.btn{border:1px solid transparent;display:inline-flex;align-items:center;justify-content:center;gap:9px;white-space:nowrap;text-decoration:none;min-height:41px;padding:10px 17px;font-size:12px;font-weight:700;letter-spacing:.25px;transition:all .2s;max-width:100%}.btn .icon-svg{width:17px;height:17px}
.btn:hover:not(:disabled){transform:translateY(-2px);box-shadow:0 5px 15px #35413225}.btn:active:not(:disabled){transform:translateY(0)}
.btn-primary{background:var(--forest);color:#fff9eb;border-color:var(--forest)}.btn-primary:hover{background:#314d3b}
.btn-secondary{background:#f8f0df;color:var(--forest);border-color:#c8cbb4}.btn-secondary:hover{background:#eaeedc}
.btn-clay{background:#986a4a;color:#fffaf0}.btn-plain{background:transparent;color:var(--forest);border-color:transparent;padding:7px 3px;min-height:34px}
.btn-danger{background:#f4e7dd;color:#934b3b;border:1px solid #dcb6a5}
.btn-small{min-height:34px;padding:6px 11px;font-size:11px}
.round-icon{height:42px;width:42px;border-radius:50%;display:grid;place-items:center;flex-shrink:0;background:#e8ecdd;color:var(--forest)}
.stamp{font:italic 13px Georgia,serif;color:#988561;transform:rotate(-4deg);letter-spacing:.2px}
.pill{border:1px solid #d3d5bf;background:#edf0df;color:var(--forest);border-radius:40px;padding:5px 10px;font-size:11px;font-weight:700;display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.pill.gold{border-color:#e5d4a9;background:#f5edcf;color:#866532}.pill.clay{border-color:#e9d0c0;background:#f7e7d7;color:#9c6c4c}
.progress-track{height:9px;background:#e6e1ce;border-radius:15px;overflow:hidden}.progress-fill{height:100%;background:linear-gradient(90deg,#8c9f79,#42644c);border-radius:15px;transition:width .4s}
/* Hearth */
.hearth-grid{display:grid;grid-template-columns:minmax(0,1.65fr) minmax(270px,.72fr);gap:21px;align-items:start}
.scene-card{background:#dbc9a9;position:relative;min-height:350px}.scene-wrap{position:relative;overflow:hidden;height:clamp(320px,33.5vw,428px);background:linear-gradient(135deg,#ddd1aa,#b8a77e);isolation:isolate}
.scene-art{width:100%;height:100%;object-fit:cover;object-position:center;display:block;filter:saturate(.85) sepia(.07)}
.scene-wrap:after{content:'';pointer-events:none;position:absolute;inset:0;background:linear-gradient(180deg,transparent 47%,#281f151f 92%);z-index:4}
.scene-overlay{position:absolute;inset:0;pointer-events:none;z-index:2;transition:background 1s}
.scene-wrap[data-time="dawn"] .scene-overlay{background:linear-gradient(95deg,#e4b67b40,#f9c8781c)}
.scene-wrap[data-time="day"] .scene-overlay{background:linear-gradient(100deg,#f6eec41f,transparent)}
.scene-wrap[data-time="dusk"] .scene-overlay{background:linear-gradient(90deg,#9b704b55,#4d505939)}
.scene-wrap[data-time="night"] .cat-eyes{animation-duration:10s}.scene-wrap[data-time="night"] .scene-overlay{background:linear-gradient(110deg,#152c4369,#27364965)}
.scene-light{position:absolute;left:20%;top:2%;width:60%;height:85%;background:radial-gradient(ellipse,#f7dfa14a,transparent 70%);z-index:2;animation:shimmer 8s ease-in-out infinite;pointer-events:none}
@keyframes shimmer{50%{opacity:.5;transform:scale(1.05)}}
.scene-caption{position:absolute;z-index:6;bottom:15px;left:16px;border:1px solid #e3d4b9aa;border-radius:30px;background:#fcf7e7de;backdrop-filter:blur(5px);padding:8px 13px;color:#536449;font:italic 12px Georgia,serif;box-shadow:0 4px 10px #46392933;pointer-events:none}
.scene-star{position:absolute;z-index:3;color:#ffe4a0;font:22px Georgia,serif;animation:float-star 5s ease-in-out infinite;pointer-events:none;text-shadow:0 0 12px #f2d295}.scene-star.s1{left:27%;top:15%}.scene-star.s2{right:21%;top:28%;animation-delay:1.6s;font-size:16px}.scene-star.s3{left:65%;top:11%;animation-delay:2.8s;font-size:11px}
@keyframes float-star{0%,100%{opacity:.35;transform:translateY(0) scale(.85)}50%{opacity:.9;transform:translateY(-10px) scale(1.1)}}
.leaf-fall{position:absolute;z-index:5;font-size:17px;color:#b7804e;top:-40px;animation:fall 13s linear infinite;pointer-events:none}.leaf-fall.l1{left:14%}.leaf-fall.l2{left:84%;animation-delay:-6s}.leaf-fall.l3{left:58%;animation-delay:-10s;font-size:11px}
@keyframes fall{0%{transform:translate(0,-35px) rotate(0deg);opacity:0}10%{opacity:.7}85%{opacity:.7}100%{transform:translate(90px,520px) rotate(360deg);opacity:0}}
.yarrow-stage{position:absolute;z-index:5;width:clamp(182px,29%,240px);bottom:11%;left:50%;transform:translateX(-50%);border:0;background:none;padding:0;overflow:visible;cursor:pointer;filter:drop-shadow(0 9px 7px #27261c54);-webkit-tap-highlight-color:transparent}
.yarrow-stage:hover{filter:drop-shadow(0 12px 9px #28271c70)}.yarrow-stage:focus-visible{outline:3px solid #f3d292;border-radius:60px}.yarrow-stage .cat-figure{width:100%;height:auto;overflow:visible}
.cat-figure .cat-tail{transform-origin:75% 74%;animation:tail-sway 4.5s ease-in-out infinite}.cat-figure .cat-body{transform-origin:center 84%;animation:cat-breathe 3.5s ease-in-out infinite}.cat-figure .cat-head{transform-origin:center 48%;animation:head-tilt 9s ease-in-out infinite}.cat-figure .cat-eyes{transform-box:fill-box;transform-origin:center;animation:cat-blink 7s infinite}.cat-figure .cat-paw{transform-origin:62% 78%;animation:cat-paw 11s ease-in-out infinite}
.yarrow-stage.petting .cat-head,.cat-stage.petting .cat-head{animation:cat-nuzzle .65s ease-in-out 2}
.yarrow-stage.petting .cat-tail,.cat-stage.petting .cat-tail{animation:tail-happy .42s ease-in-out 4}
@keyframes tail-sway{0%,100%{transform:rotate(-10deg)}50%{transform:rotate(15deg)}}
@keyframes tail-happy{0%,100%{transform:rotate(-21deg)}50%{transform:rotate(21deg)}}
@keyframes cat-breathe{0%,100%{transform:scaleY(1)}50%{transform:scaleY(1.012)}}
@keyframes head-tilt{0%,30%,100%{transform:rotate(0)}41%,52%{transform:rotate(3deg)}}
@keyframes cat-blink{0%,4%,45%,47%,97%,100%{transform:scaleY(1)}45.6%,46.5%{transform:scaleY(.1)}}
@keyframes cat-paw{0%,88%,100%{transform:rotate(0deg)}90%,94%{transform:rotate(-9deg)}}
@keyframes cat-nuzzle{0%,100%{transform:rotate(0)}50%{transform:rotate(9deg)}}
.heart-pop{position:absolute;z-index:9;left:50%;bottom:60%;color:#fae7b9;pointer-events:none;font:30px Georgia,serif;text-shadow:0 2px 2px #6a4b42;animation:heart-pop 1.1s ease-out forwards}
@keyframes heart-pop{0%{opacity:0;transform:translate(-50%,0) scale(.2)}35%{opacity:1;transform:translate(-50%,-35px) scale(1.2)}100%{opacity:0;transform:translate(-50%,-95px) scale(.8)}}
.speech-panel{padding:15px 23px 19px;display:flex;align-items:center;justify-content:space-between;gap:15px;background:#f6efdb;border-top:1px solid #d9c7a5}.speech-panel p{font:italic 18px/1.35 'Fraunces',Georgia,serif;color:#455c46;margin:0}.speech-label{font:700 10px 'DM Sans',sans-serif;letter-spacing:1.3px;text-transform:uppercase;color:#a6824e;display:block;margin-bottom:4px}.pet-cue{font:11px 'DM Sans',sans-serif;color:#8d836f;white-space:nowrap}
.hearth-side{display:grid;gap:20px}.today-card{padding:22px 23px;background:linear-gradient(135deg,#fcf7e9,#f6f0de)}.circle-stats{display:flex;align-items:center;gap:17px;margin:19px 0}.progress-ring{--p:0;flex-shrink:0;width:98px;height:98px;border-radius:50%;background:conic-gradient(#6e8c65 calc(var(--p) * 1%),#e0e4d3 0);display:grid;place-items:center}.progress-ring:before{content:'';position:absolute;background:#fcf7e9;border-radius:50%;width:75px;height:75px}.ring-number{position:relative;font:500 27px 'Fraunces',Georgia,serif;color:#3b5846}.ring-number small{font:12px 'DM Sans',sans-serif;color:#79816f}.progress-note{font-size:13px;color:#68755f}.progress-note strong{display:block;font-family:Fraunces,Georgia,serif;font-size:20px;font-weight:500;color:#415848;margin-bottom:3px}.line-progress{margin-top:12px}
.moon-mirror-teaser{position:relative;padding:22px 22px;background:linear-gradient(135deg,#e5eadb,#d6dfd0);border-color:#bdc8af}.mirror-circle{width:72px;height:72px;border-radius:50%;border:4px double #869779;background:radial-gradient(circle at 40% 40%,#fff7d9,#c1cdb9);display:grid;place-items:center;color:#6b8065;font:48px Georgia;margin:14px 0 8px;box-shadow:0 4px 14px #6c896738}.mirror-teaser-text{font:italic 15px Georgia,serif;color:#556b56;margin:0 0 14px}
.action-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:15px;margin-top:22px}.action-tile{display:flex;flex-direction:column;align-items:flex-start;text-align:left;padding:20px 18px;min-height:155px;gap:10px;background:#fbf6e9;border:1px solid #dcd0b7;border-radius:17px;transition:transform .22s,box-shadow .22s,background .22s;position:relative;overflow:hidden}.action-tile:after{content:'✧';font:29px Georgia;position:absolute;right:15px;top:8px;color:#d0ba88}.action-tile:hover{transform:translateY(-4px);background:#fffaf0;box-shadow:0 12px 20px #74654322}.action-tile .round-icon{width:43px;height:43px}.action-tile strong{font:500 19px 'Fraunces',Georgia,serif}.action-tile small{font-size:11px;color:#848475;line-height:1.3}.action-tile:nth-child(2) .round-icon{background:#f3e8d0;color:#967448}.action-tile:nth-child(3) .round-icon{background:#e6dfe1;color:#806a78}.action-tile:nth-child(4) .round-icon{background:#ecdfd4;color:#9e704b}
.bottom-grid{display:grid;grid-template-columns:1fr 1fr;gap:20px;margin-top:23px}.quiet-card{padding:22px;position:relative}.quiet-card p{font:italic 16px/1.55 Georgia,serif;color:#586b57}.seasonal-card{background:linear-gradient(120deg,#f3e6d3,#ece5d2);border-color:#d9c8ab}.note-flourish{position:absolute;right:16px;top:11px;color:#c4a77c;font-size:34px;opacity:.65}
/* Rituals */

  function pageTitle(kicker, heading, sub, extra='') {
    return `<div class="section-intro"><div><p class="kicker">${esc(kicker)}</p><h1 class="page-title">${heading}</h1>${sub?`<p class="page-subtitle">${sub}</p>`:''}</div>${extra}</div>`;
  }
  function renderHearth() {
    const done = todayDone().length, total = state.rituals.length, progress = progressPercentage();
    const todayMood = state.checkins.find(m=>m.date===todayKey());
    const messages = {
      dawn: 'The kettle is warm. Shall we begin softly?',
      day: 'A little magic is waiting in the ordinary.',
      dusk: 'You have done enough to deserve a quiet moment.',
      night: 'Come closer to the fire. The world can wait.'
    };
    const greetingText = done===total && total>0?'Our little magic is complete for today.':messages[timeOfDay()];
    const extra = `<div class="date-ornament"><span>${esc(moonPhase().name)}</span>${esc(shortDate())}</div>`;
    return `<div class="view hearth-view">
      ${pageTitle('Welcome to your little world',greeting().replace(/^Good ([a-z]+)/,'Good <em>$1</em>'), 'An ordinary day can hold a little enchantment.',extra)}
      <div class="hearth-grid">
        <section class="card scene-card" aria-label="The Hearth with Yarrow">
          ${hearthScene()}
          <div class="speech-panel"><div><span class="speech-label">A whisper from Yarrow</span><p>“${esc(greetingText)}”</p></div><span class="pet-cue">♡ Little familiar, big heart</span></div>
        </section>
        <div class="hearth-side">
          <section class="card today-card">
            <div class="row-space"><h2 class="card-heading">Today’s little magic</h2><span class="pill gold">✧ ${state.petals} petals</span></div>
            <div class="circle-stats"><div class="progress-ring" style="--p:${progress}"><div class="ring-number">${done}<small> / ${total}</small></div></div><div class="progress-note"><strong>${done===0?'A fresh beginning':done===total&&total?'Beautifully tended':'Growing gently'}</strong>${done===0?'One small ritual is plenty to start.':done===total&&total?'Every little ritual has found a home.':'A little kindness, already done.'}</div></div>
            <div class="progress-track"><div class="progress-fill" style="width:${progress}%"></div></div>
            <button class="btn btn-plain" type="button" data-nav="rituals">See today’s rituals ${icon('arrow')}</button>
          </section>
          <section class="card moon-mirror-teaser">
            <div class="row-space"><h2 class="card-heading">The Moon Mirror</h2><span class="stamp">gentle check-in</span></div>
            <div class="mirror-circle" aria-hidden="true">☾</div>
            <p class="mirror-teaser-text">${todayMood?`Your spirit felt ${MOODS.find(m=>m.id===todayMood.mood)?.label.toLowerCase() || 'quiet'} today.`:'How is the weather in your heart today?'}</p>
            <button type="button" class="btn btn-secondary btn-small" data-action="mirror">${todayMood?'Visit the mirror':'Check in with Yarrow'} ${icon('arrow')}</button>
          </section>
        </div>
      </div>
      <div class="action-grid">
        <button class="action-tile" type="button" data-action="mirror"><span class="round-icon">${icon('moon')}</span><strong>Check In</strong><small>Take the temperature of your heart</small></button>
        <button class="action-tile" type="button" data-nav="rituals"><span class="round-icon">${icon('leaf')}</span><strong>Daily Rituals</strong><small>Tend a little part of yourself</small></button>
        <button class="action-tile" type="button" data-nav="grimoire"><span class="round-icon">${icon('book')}</span><strong>The Grimoire</strong><small>Leave a thought on the page</small></button>
        <button class="action-tile" type="button" data-nav="cottage"><span class="round-icon">${icon('cottage')}</span><strong>The Cottage</strong><small>Make your world feel like home</small></button>
      </div>
      <div class="bottom-grid">
        <section class="card quiet-card seasonal-card"><span class="note-flourish">${season().glyph}</span><p class="kicker">A note from the season</p><h2 class="card-heading">${season().title}</h2><p>“${season().text}”</p><button class="btn btn-plain" data-nav="cottage" type="button">Visit the garden ${icon('arrow')}</button></section>
        <section class="card quiet-card"><span class="note-flourish">✧</span><p class="kicker">For whatever today brings</p><h2 class="card-heading">A gentle reminder</h2><p>“There are no lost days here. Yarrow never counts the moments you were away—only the moments you found your way back.”</p><button class="btn btn-plain" data-nav="yarrow" type="button">Spend a moment with Yarrow ${icon('arrow')}</button></section>
      </div>
    </div>`;
  }

    return `<div class="view rituals-view">

      <div class="ritual-summary"><div class="card summary-large"><div><span class="eyebrow">Your day, gently tended</span><div><strong>${done} of ${total}</strong> <span class="tiny-muted">rituals complete</span></div><div class="progress-track" style="margin-top:13px;min-width:175px"><div class="progress-fill" style="width:${progressPercentage()}%"></div></div></div><span style="font-size:45px;color:#95a88c" aria-hidden="true">❧</span></div><div class="card summary-small"><span class="eyebrow">Petals gathered</span><div><strong>✿ ${state.petals}</strong></div><span class="tiny-muted">For herbs, charms & cozy things</span></div></div>
      <div class="row-space" style="margin-bottom:9px"><h2 class="section-heading" style="margin:0">Today’s tending</h2><button type="button" class="btn btn-primary" data-action="add-ritual">${icon('plus')} Add a ritual</button></div>
      <div class="filters" aria-label="Filter rituals">${CATEGORIES.map(c=>`<button type="button" class="filter-btn ${filter===c?'active':''}" data-filter="${c}" aria-pressed="${filter===c}">${c}</button>`).join('')}</div>
      <div class="ritual-list">${tasks.length?tasks.map(r=>`<div class="ritual-row ${isDone(r.id)?'completed':''}">
        <button class="ritual-check" type="button" data-action="toggle-ritual" data-id="${esc(r.id)}" aria-label="${isDone(r.id)?'Mark incomplete':'Complete'}: ${esc(r.title)}" aria-pressed="${isDone(r.id)}">${icon('check')}</button>
        <div><span class="ritual-name">${esc(r.title)}</span><span class="ritual-hint">${esc(r.hint||r.area)} · ${esc(r.area)}</span></div>
        <div class="ritual-meta"><span class="ritual-reward">${isDone(r.id)?'✓ Tended':'+4 ✿'}</span><button type="button" class="del-icon" data-action="delete-ritual" data-id="${esc(r.id)}" aria-label="Remove ${esc(r.title)}" title="Remove ritual">${icon('trash')}</button></div>
      </div>`).join(''):'<div class="card empty-state">No rituals in this little corner yet. Try another category, or add your own.</div>'}</div>
      <div class="ritual-footer"><p class="tiny-muted">✧ New day, fresh page. Unfinished rituals never count against you.</p><button type="button" class="btn btn-secondary" data-action="add-ritual">${icon('plus')} Make your own ritual</button></div>
    </div>`;
  }
  function renderGrimoire() {
    const prompt = PROMPTS[promptIndex%PROMPTS.length];
    const entries = [...state.journal].sort((a,b)=>String(b.date).localeCompare(String(a.date)));
    return `<div class="view grimoire-view">
      ${pageTitle('Ink, herbs & quiet thoughts','The <em>Grimoire</em>','A safe place for unfinished thoughts, moments of gratitude, and all the things that need somewhere to land.')}
      <div class="grimoire-layout"><div>
        <section class="card journal-editor"><p class="kicker">${journalEditingId?'Revisit a page':'A blank page awaits'}</p><h2 class="card-heading">${journalEditingId?'Edit your entry':'Write a little something'}</h2><label for="journal-text">Your thoughts are welcome, exactly as they are</label>
          <form data-form="journal"><textarea id="journal-text" name="text" maxlength="10000" required placeholder="Dear grimoire, today I...">${esc(journalDraft)}</textarea><div class="form-actions">${journalEditingId?'<button class="btn btn-secondary" type="button" data-action="cancel-journal">Cancel edit</button>':''}<button type="submit" class="btn btn-primary">${icon('pen')} ${journalEditingId?'Save changes':'Keep this page'}</button></div></form>
        </section>
        <div class="row-space" style="margin:26px 0 13px"><h2 class="section-heading" style="margin:0">Pages you’ve kept</h2><span class="pill">${state.journal.length} entr${state.journal.length===1?'y':'ies'}</span></div>
        <div class="entry-list">${entries.length?entries.map(e=>`<article class="card entry-card"><time datetime="${esc(e.date.slice(0,10))}">${esc(formatEntryDate(e.date))}</time>${e.prompt?`<div class="entry-prompt">${esc(e.prompt)}</div>`:''}<p>${esc(e.text)}</p><div class="entry-actions"><button class="btn btn-plain btn-small" type="button" data-action="edit-journal" data-id="${esc(e.id)}">${icon('pen')} Edit</button><button class="btn btn-plain btn-small" type="button" data-action="delete-journal" data-id="${esc(e.id)}">${icon('trash')} Remove</button></div></article>`).join(''):'<div class="card empty-state">Every grimoire begins with a blank page. Yours is ready whenever you are. ❧</div>'}</div>
      </div><aside style="display:grid;gap:20px">
        <section class="card prompt-card"><span class="eyebrow">A thought to wander with</span><blockquote>“${esc(prompt)}”</blockquote><button type="button" class="btn btn-secondary btn-small" data-action="new-prompt">Another thought ${icon('arrow')}</button></section>
        <section class="card breath-card"><span class="eyebrow">A tiny grounding spell</span><h2 class="card-heading" style="margin-top:7px">A moment to breathe</h2><div class="breath-orb" id="breath-orb"><span id="breath-phase">Be here</span></div><p class="breath-info" id="breath-info">Breathe in 4 · hold 4 · breathe out 6</p><button type="button" class="btn btn-secondary" id="breath-btn" data-action="breath-toggle">${icon('spark')} Begin a breath</button><p class="tiny-muted" style="margin-top:13px">Stop anytime. There is no perfect way to breathe.</p></section>
        <section class="card card-pad"><span class="eyebrow">Your pages are yours</span><p class="card-subtext">Journal entries are stored on this device. You can download a backup in Settings. They are not sent to us.</p></section>
      </aside></div>
    </div>`;
  }
  function formatEntryDate(value) { const d = new Date(value); return Number.isNaN(d.getTime()) ? 'A page in time' : new Intl.DateTimeFormat('en-US',{month:'long',day:'numeric',year:'numeric'}).format(d); }
  function decorOverlay() {return DECOR.filter(d=>state.decorVisible.includes(d.id)).map(d=>`<span class="decor-overlay ${d.id==='fern'?'plant':d.id}" aria-label="${esc(d.name)}" role="img">${d.emoji}</span>`).join('');}
  function renderCottage() {
    const isRoom=cottageTab==='room';
    return `<div class="view cottage-view">
      ${pageTitle('A little place to grow','Your <em>Cottage</em>','Each act of self-care adds a little beauty to the home you and Yarrow are growing together.',`<span class="pill gold">✿ ${state.petals} petals</span>`)}
      <div class="tabs" role="tablist" aria-label="Cottage areas"><button type="button" class="tab-button ${isRoom?'active':''}" data-cottage-tab="room" role="tab" aria-selected="${isRoom}">✧ The cottage</button><button type="button" class="tab-button ${!isRoom?'active':''}" data-cottage-tab="garden" role="tab" aria-selected="${!isRoom}">❧ The garden</button></div>
      ${isRoom?renderRoom():renderGarden()}
    </div>`;
  }
  function renderRoom() {
    return `<div class="cottage-layout"><div>
      <section class="card cottage-visual">${hearthScene('room-scene')}<span class="visual-badge">♡ Your own little sanctuary</span>${decorOverlay()}</section>
      <p class="tiny-muted" style="margin-top:12px">Decorate as slowly as you please. There is no hurry to finish a home.</p>
      </div><section class="card card-pad"><div class="row-space"><h2 class="card-heading">Cottage comforts</h2><span class="pill gold">✿ ${state.petals}</span></div><p class="card-subtext">Spend petals from your rituals to gather lovely little things.</p><div class="shop-grid">
      ${DECOR.map(d=>{const owned=state.decorOwned.includes(d.id),visible=state.decorVisible.includes(d.id);return `<div class="shop-item"><span class="shop-emoji" aria-hidden="true">${d.emoji}</span><strong>${d.name}</strong><small>${d.hint}</small><button type="button" class="btn ${owned?(visible?'btn-secondary':'btn-primary'):'btn-primary'} btn-small" data-action="decor" data-id="${d.id}" ${!owned&&state.petals<d.price?'disabled':''}>${owned?(visible?'Put away':'Place in room'):d.price===0?'Free':`${d.price} petals`}</button></div>`}).join('')}
      </div></section></div>`;
  }
  function plantDrawing(p, growth) {
    const height=14+growth*14;let leaves='';
    for(let i=0;i<growth*2+1;i++){
      const y=87-i*(height/(growth*2+2))-8;
      const side=i%2===0?-1:1;
      const x=45+side*(8+i%3*2);
      leaves += `<ellipse cx="${x}" cy="${y}" rx="${growth>=3?11:8}" ry="${growth>=3?5.5:4}" fill="${p.leaf}" transform="rotate(${side*29} ${x} ${y})"/>`;
    }
    let blooms='';
    if(growth>=4){for(let i=0;i<4;i++){const x=32+i*9,y=20+((i*7)%10); blooms+=`<g><circle cx="${x}" cy="${y}" r="6" fill="${p.bloom}"/><circle cx="${x}" cy="${y}" r="2" fill="#d9ad5c"/></g>`;}}
    return `<svg viewBox="0 0 90 112" aria-hidden="true"><ellipse cx="45" cy="99" rx="29" ry="8" fill="#516343" opacity=".22"/><path d="M25 85h40l-5 22H30Z" fill="#aa7959" stroke="#81573f" stroke-width="2"/><ellipse cx="45" cy="84" rx="21" ry="5" fill="#5d5d42"/><path d="M45 86Q${growth>=3?'40':'48'} ${77-growth*8} 45 ${85-height}" stroke="${p.stem}" stroke-width="3" fill="none" stroke-linecap="round"/>${leaves}${blooms}</svg>`;
  }
  function renderGarden() {
    const harvested=Object.values(state.herbarium).reduce((a,b)=>a+Number(b||0),0);
    return `<div class="cottage-layout"><div><div class="card garden-board"><div class="row-space" style="position:relative;z-index:2;margin:0 0 15px"><div><span class="eyebrow">Behind the cottage gate</span><h2 class="card-heading">Yarrow’s little garden</h2></div><span class="stamp">grow at your own pace</span></div>
    <div class="garden-plots">${state.garden.map((plot,i)=>{const p=plot?PLANTS.find(x=>x.id===plot.plant):null;return `<button type="button" class="garden-plot ${!p?'empty':''}" data-action="garden-plot" data-index="${i}" aria-label="Garden plot ${i+1}: ${p?`${p.name}, ${plot.growth===4?'ready to harvest':`growth stage ${plot.growth} of 4`}`:'empty, plant a seed'}">${p?plantDrawing(p,plot.growth):'<span class="plot-plus">+</span><small>Plant a seed</small>'}${p?`<span class="plant-caption">${p.name} ${plot.growth===4?'✿':`${plot.growth}/4`}</span>`:''}</button>`}).join('')}</div></div>
      <p class="tiny-muted" style="margin-top:13px">Seeds cost petals. Your plants grow when you complete rituals, not when you log in. Nothing withers while you’re away.</p>
      </div><div style="display:grid;gap:18px"><section class="card card-pad"><h2 class="card-heading">The Herbarium</h2><p class="card-subtext">A little record of everything you’ve tended and gathered.</p><div class="herbarium">${PLANTS.map(p=>`<div class="herbarium-item ${state.herbarium[p.id]?'discovered':''}"><span>${p.emoji}</span>${p.name}<br><strong>${state.herbarium[p.id]||0} gathered</strong></div>`).join('')}</div><p class="tiny-muted" style="margin-top:13px">${harvested?`${harvested} little bundle${harvested===1?'':'s'} in your collection.`:'Your first harvest is waiting in a future chapter.'}</p></section><section class="card card-pad card-paper"><span class="eyebrow">How the garden grows</span><p style="font-family:Georgia,serif;color:#637761">Every first-time ritual completion encourages the herbs in your garden. Harvest them when fully grown to receive petals and a little keepsake in your Herbarium.</p></section></div></div>`;
  }
  function renderYarrow() {
    const next = CHAPTERS.find(ch=>state.friendship<ch.need);

    return `<div class="view yarrow-view">

      <div style="display:grid;gap:18px"><section class="card card-pad"><div class="row-space"><h2 class="card-heading">A familiar’s wardrobe</h2><span class="pill gold">✿ ${state.petals}</span></div><p class="card-subtext">Handmade trinkets for the tiniest apothecary assistant.</p><div class="outfit-grid">${OUTFITS.map(o=>{const owned=state.outfitsOwned.includes(o.id),selected=state.outfit===o.id;return `<button type="button" class="outfit-option ${selected?'selected':''}" data-action="outfit" data-id="${o.id}" ${!owned&&state.petals<o.price?'disabled':''}><span class="outfit-emoji" aria-hidden="true">${o.emoji}</span><strong>${o.name}</strong><small>${selected?'Wearing now':owned?'Try on':`${o.price} petals`}</small></button>`}).join('')}</div></section>
      <section class="card chapter-card"><p class="eyebrow">The story of a familiar</p><h2 class="card-heading">Yarrow’s Storybook</h2><p>The little chapters she shares as your friendship unfolds.</p>${CHAPTERS.map((ch,i)=>{const unlocked=state.friendship>=ch.need;return `<button type="button" class="btn ${unlocked?'btn-secondary':'btn-plain'}" style="display:flex;width:100%;justify-content:space-between;text-align:left;margin-top:7px;white-space:normal" data-action="chapter" data-index="${i}" ${unlocked?'':'disabled'}><span>Chapter ${i+1}: ${esc(ch.title)}</span><span>${unlocked?icon('book'):icon('lock')}</span></button>`}).join('')}</section></div></div>
    </div>`;
  }
  function render() {
    stopBreathing();
    const views = {hearth:renderHearth,rituals:renderRituals,grimoire:renderGrimoire,cottage:renderCottage,yarrow:renderYarrow};
    main.innerHTML=(views[view]||renderHearth)();
    document.querySelectorAll('[data-nav]').forEach(el=>{const current=el.dataset.nav===view;el.classList.toggle('active',current); if(current){el.setAttribute('aria-current','page')}else{el.removeAttribute('aria-current')}});
    document.getElementById('season-chip').textContent=`${season().glyph} ${season().label}`;
    document.getElementById('sidebar-moon').textContent=moonPhase().name;
    document.body.classList.toggle('motion-off',!state.animation);
  }
  function changeView(next) {
    if(!['hearth','rituals','grimoire','cottage','yarrow'].includes(next))return;
    closeModal();
    view=next;
    render();
    window.scrollTo({top:0,behavior:state.animation?'smooth':'auto'});
  }
  function toggleRitual(id) {
    if(!state.rituals.some(r=>r.id===id))return;
    const date=todayKey();const done=Array.isArray(state.logs[date])?state.logs[date]:[];
    if(done.includes(id)) { state.logs[date]=done.filter(x=>x!==id); save(); render(); toast('Unmarked. Every day can be edited.'); return; }
    state.logs[date]=[...done,id];
    const awarded=Array.isArray(state.awards[date])?state.awards[date]:[];
    if(!awarded.includes(id)){
      state.awards[date]=[...awarded,id];state.petals+=4;state.friendship+=1;state.totalMagic+=1;
      state.garden.forEach(plot=>{if(plot && plot.growth<4)plot.growth++});
      toast('✿ +4 petals! Yarrow gives a happy little purr.');
      if(state.sound) playPurr(.55);
    } else { toast('A little ritual, lovingly checked.'); }
    save();render();
  }
  function editRitualModal() {
    openModal(`<span class="eyebrow">A ritual of your own</span><h2>Make a little ritual</h2><p>Choose one small, real-world act of care. It only needs to matter to you.</p><form data-form="add-ritual"><div class="field-group"><label for="ritual-title">Name your ritual</label><input type="text" id="ritual-title" name="title" maxlength="90" required placeholder="e.g. Water the houseplants" autofocus></div><div class="field-group"><label for="ritual-area">Where does this ritual belong?</label><select id="ritual-area" name="area"><option>Body</option><option>Mind</option><option>Home</option><option>Spirit</option></select></div><div class="field-group"><label for="ritual-hint">A gentle reminder (optional)</label><input type="text" id="ritual-hint" name="hint" maxlength="150" placeholder="A small act of kindness"></div><div class="form-actions"><button type="button" class="btn btn-secondary" data-action="close-modal">Not now</button><button type="submit" class="btn btn-primary">${icon('plus')} Add to my rituals</button></div></form>`);
    document.getElementById('ritual-title')?.focus();
  }
  function openModal(inner, style='') {
    modalOpener=document.activeElement;
    modalRoot.innerHTML=`<div class="modal-backdrop" data-backdrop><section class="modal-panel ${style}" role="dialog" aria-modal="true" aria-label="A Whisker a Day dialog"><button type="button" class="modal-close" data-action="close-modal" aria-label="Close dialog">${icon('x')}</button>${inner}</section></div>`;
    document.body.style.overflow='hidden';
    modalRoot.querySelector('.modal-close')?.focus({preventScroll:true});
  }
  function closeModal() {if(!modalRoot.innerHTML)return;modalRoot.innerHTML='';document.body.style.overflow='';if(modalOpener&&modalOpener.isConnected)modalOpener.focus({preventScroll:true});modalOpener=null;}
  function openMirror() {
    const current=state.checkins.find(m=>m.date===todayKey());moodDraft={mood:current?.mood||'cloudy',note:current?.note||''};
    drawMirror();
  }
  function drawMirror() {
    const mood=MOODS.find(m=>m.id===moodDraft.mood)||MOODS[1];
    const lastDays=Array.from({length:7},(_,i)=>{const d=new Date();d.setDate(d.getDate()-(6-i));const check=state.checkins.find(m=>m.date===todayKey(d));return {day:new Intl.DateTimeFormat('en-US',{weekday:'short'}).format(d),check};});

      <div style="margin-top:22px;padding-top:18px;border-top:1px solid #e3d8c4"><span class="eyebrow">Your last seven days</span><div class="history-grid">${lastDays.map(x=>`<div class="history-day"><b title="${x.check?esc(MOODS.find(m=>m.id===x.check.mood)?.label):'No check-in'}">${x.check?MOODS.find(m=>m.id===x.check.mood)?.label==='Sunny'?'☀':x.check.mood==='cloudy'?'☁':x.check.mood==='rainy'?'☂':x.check.mood==='windy'?'≋':'☾':'·'}</b>${x.day}</div>`).join('')}</div></div>`;

  function playPurr(duration=1) {
    if(!state.sound)return;
    try {
      const AC=window.AudioContext||window.webkitAudioContext;
      if(!AC)return;
      audioContext=audioContext||new AC();
      if(audioContext.state==='suspended')audioContext.resume().catch(()=>{});
      const now=audioContext.currentTime;
      const master=audioContext.createGain();master.gain.setValueAtTime(0,now);master.gain.linearRampToValueAtTime(.055,now+.08);master.gain.setValueAtTime(.055,now+duration-.12);master.gain.linearRampToValueAtTime(0,now+duration);
      master.connect(audioContext.destination);
      const mod=audioContext.createOscillator(),modGain=audioContext.createGain();mod.type='sine';mod.frequency.value=24;modGain.gain.value=.026;mod.connect(modGain);
      const o=audioContext.createOscillator(),g=audioContext.createGain();o.type='triangle';o.frequency.setValueAtTime(93,now);o.frequency.linearRampToValueAtTime(107,now+duration);g.gain.value=.45;modGain.connect(g.gain);o.connect(g);g.connect(master);
      const high=audioContext.createOscillator(),hg=audioContext.createGain();high.type='sine';high.frequency.value=162;hg.gain.value=.09;high.connect(hg);hg.connect(master);
      mod.start(now);o.start(now);high.start(now);mod.stop(now+duration);o.stop(now+duration);high.stop(now+duration);
      setTimeout(()=>{try{mod.disconnect();o.disconnect();high.disconnect();master.disconnect()}catch{}},Math.ceil((duration+0.15)*1000));
    } catch { /* Some phones mute Web Audio; visual feedback still works. */ }
  }
  function petYarrow(source=null) {
    const target = source?.closest('.yarrow-stage,.cat-stage')||document.querySelector('.cat-stage,.yarrow-stage');
    if(target){target.classList.remove('petting');void target.offsetWidth;target.classList.add('petting');setTimeout(()=>target.classList.remove('petting'),1400);
      const parent=target.parentElement;if(parent){const span=document.createElement('span');span.className='heart-pop';span.setAttribute('aria-hidden','true');span.textContent='♡';parent.append(span);setTimeout(()=>span.remove(),1200);}}
    const date=todayKey();const count=Number(state.petToday[date]||0);
    if(count<5){state.friendship++;state.petToday[date]=count+1;save();}
    playPurr(1.05);
    const lines=['Yarrow leans into your hand. ♡','A tiny purr, just for you.','Yarrow gives you a very serious slow blink.','Her tail curls into a little question mark.','Yarrow has decided you are excellent company.'];
    toast(lines[Math.floor(Math.random()*lines.length)]);
    if(view==='yarrow'){const label=document.querySelector('.friendship-line');if(label){const progress=state.friendship;label.querySelector('.tiny-muted:last-child').textContent=`${progress} little moments`;}}
  }
  function yarrowWisdom() {
    const lines=['The tea tastes better when we sit down to drink it.','Small steps still make a path through the woods.','It is quite all right to grow at a different pace than the garden next door.','A warm patch of sunlight is a perfectly good plan for the afternoon.','The candle can always be relit.','You do not need to earn the right to rest.','I liked you before you crossed anything off your list.'];
    openModal(`<span class="eyebrow">A whisper from Yarrow</span><h2>A little bit of familiar wisdom</h2><p style="font:italic 22px/1.5 Fraunces,Georgia,serif;color:#4a654f;margin:25px 0">“${lines[Math.floor(Math.random()*lines.length)]}”</p><div class="form-actions"><button class="btn btn-primary" type="button" data-action="close-modal">Keep this in my heart ${icon('heart')}</button></div>`,'narrow');
  }
  function outfit(id) {
    const o=OUTFITS.find(i=>i.id===id);if(!o)return;
    if(!state.outfitsOwned.includes(id)){
      if(state.petals<o.price){toast('A few more petals will help you gather that.');return;}
      state.petals-=o.price;state.outfitsOwned.push(id);toast(`${o.name} found a home with Yarrow!`);
    }
    state.outfit=id;save();render();
  }
  function decor(id) {
    const d=DECOR.find(i=>i.id===id);if(!d)return;
    if(!state.decorOwned.includes(id)){
      if(state.petals<d.price)return;
      state.petals-=d.price;state.decorOwned.push(id);state.decorVisible.push(id);toast(`${d.name} added to your cottage!`);
    }else{
      if(state.decorVisible.includes(id))state.decorVisible=state.decorVisible.filter(x=>x!==id);else state.decorVisible.push(id);
    }
    save();render();
  }
  function gardenPlot(i) {
    const plot=state.garden[i];if(i<0||i>=6)return;
    if(plot){const p=PLANTS.find(x=>x.id===plot.plant);if(!p)return;
      openModal(`<span class="eyebrow">Garden patch ${i+1}</span><h2>${p.emoji} ${p.name}</h2><p>${plot.growth===4?'This little herb is ready to be gathered!':'A little patience and kindness will help it grow.'}</p><div class="progress-track" style="margin:22px 0"><div class="progress-fill" style="width:${plot.growth*25}%"></div></div><p>${plot.growth} of 4 growing moments</p><div class="form-actions"><button type="button" class="btn btn-secondary" data-action="close-modal">Leave it growing</button>${plot.growth===4?`<button type="button" class="btn btn-primary" data-action="harvest" data-index="${i}">${icon('leaf')} Harvest (+6 petals)</button>`:''}</div>`,'narrow');return;
    }
    openModal(`<span class="eyebrow">Plant a little beginning</span><h2>Choose a seed for plot ${i+1}</h2><p>Each seed grows with your daily rituals. Nothing will ever wilt while you are away.</p><div class="shop-grid" style="margin:19px 0">${PLANTS.map(p=>`<div class="shop-item"><span class="shop-emoji">${p.emoji}</span><strong>${p.name}</strong><small>Seed packet</small><button type="button" class="btn btn-primary btn-small" data-action="plant" data-index="${i}" data-id="${p.id}" ${state.petals<p.cost?'disabled':''}>${p.cost} petals</button></div>`).join('')}</div><span class="pill gold">✿ ${state.petals} petals in your pouch</span>`,'wide');
  }
  function plant(i,id) {
    const p=PLANTS.find(x=>x.id===id);if(!p||state.garden[i]||i<0||i>=6)return;
    if(state.petals<p.cost)return;
    state.petals-=p.cost;state.garden[i]={plant:p.id,growth:0};save();closeModal();render();toast(`${p.name} planted! One small beginning. ❧`);
  }
  function harvest(i) {
    const plot=state.garden[i];if(!plot||plot.growth!==4)return;
    state.herbarium[plot.plant]=(state.herbarium[plot.plant]||0)+1;
    state.garden[i]=null;state.petals+=6;save();closeModal();render();toast('A lovely little harvest! +6 petals ❧');
  }
  function openChapter(i) {
    const ch=CHAPTERS[i];if(!ch||state.friendship<ch.need)return;

  function startBreathing() {
    const orb=document.getElementById('breath-orb');if(!orb)return;
    breathStart=Date.now();orb.classList.add('running');
    const btn=document.getElementById('breath-btn');if(btn){btn.innerHTML=`${icon('x')} Stop for now`;btn.setAttribute('aria-pressed','true');}
    breathTimer=setInterval(()=>{
      const t=((Date.now()-breathStart)/1000)%14;
      const phase=t<4?'Breathe in':t<8?'Hold softly':'Breathe out';
      const el=document.getElementById('breath-phase');if(el)el.textContent=phase;
      const info=document.getElementById('breath-info');if(info)info.textContent=`${phase} · ${Math.max(1,Math.ceil((t<4?4:t<8?8:14)-t))} seconds`;
    },150);
  }
  function stopBreathing(){if(breathTimer){clearInterval(breathTimer);breathTimer=null;}const orb=document.getElementById('breath-orb');orb?.classList.remove('running');const ph=document.getElementById('breath-phase');if(ph)ph.textContent='Be here';const btn=document.getElementById('breath-btn');if(btn){btn.innerHTML=`${icon('spark')} Begin a breath`;btn.setAttribute('aria-pressed','false');}const info=document.getElementById('breath-info');if(info)info.textContent='Breathe in 4 · hold 4 · breathe out 6';}
  function exportBackup() {
    try {
      const text=JSON.stringify({...state,version:1,exportedAt:new Date().toISOString()},null,2);
      const blob=new Blob([text],{type:'application/json'});
      const url=URL.createObjectURL(blob);
      const link=document.createElement('a');link.href=url;link.download=`a-whisker-a-day-backup-${todayKey()}.json`;document.body.append(link);link.click();link.remove();setTimeout(()=>URL.revokeObjectURL(url),3000);
      toast('Your little world is ready to keep safe.');
    }catch{toast('Could not create a backup. Please try another browser.');}
  }
  async function importBackup(file) {
    if(!file)return;
    if(file.size>2*1024*1024){toast('That backup is larger than expected (max 2 MB).');return;}
    try {
      const raw=JSON.parse(await file.text());
      if(!raw||raw.version!==1||!Array.isArray(raw.rituals)||!Array.isArray(raw.journal))throw Error('Invalid backup');
      if(!window.confirm('Restore this backup? It will replace the progress saved in this browser. Download a current backup first if you need it.'))return;
      state=normalize(raw);save();closeModal();render();toast('Your little world has been restored. Welcome home.');
    }catch{toast('This file is not a valid A Whisker a Day backup.');}
  }

    document.addEventListener('submit',(event)=>{
      const f=event.target.closest('form[data-form]');if(!f)return;event.preventDefault();
      const type=f.dataset.form;
      if(type==='add-ritual'){
        const title=f.querySelector('[name="title"]').value.trim().slice(0,90);
        const area=f.querySelector('[name="area"]').value;
        const hint=f.querySelector('[name="hint"]').value.trim().slice(0,150);
        if(!title||state.rituals.length>=80){toast('Please give your ritual a name (up to 80 rituals).');return;}
        state.rituals.push({id:uid(),title,area:CATEGORIES.includes(area)?area:'Mind',hint:hint||'A little kindness, just for you.'});save();closeModal();filter='All';render();toast('Your new ritual has a place in the book.');
      }
      if(type==='journal'){
        const value=f.querySelector('[name="text"]').value.trim();if(!value)return;
        if(journalEditingId){const entry=state.journal.find(x=>x.id===journalEditingId);if(entry)entry.text=value.slice(0,10000);toast('Your page has been lovingly updated.');}
        else{state.journal.push({id:uid(),date:new Date().toISOString(),prompt:PROMPTS[promptIndex%PROMPTS.length],text:value.slice(0,10000)});toast('A little thought, safely tucked away.');}
        journalDraft='';journalEditingId=null;save();render();
      }
      if(type==='mood'){saveMood(f.querySelector('[name="note"]')?.value);}
    });
    document.addEventListener('input',(event)=>{if(event.target.id==='journal-text')journalDraft=event.target.value;if(event.target.id==='mood-note')moodDraft.note=event.target.value;});
    document.addEventListener('change',(event)=>{if(event.target.id==='import-file'){const file=event.target.files?.[0];importBackup(file);event.target.value='';}});
    document.addEventListener('keydown',(event)=>{
      if(event.key==='Escape'&&modalRoot.innerHTML){closeModal();return;}
      // Keep Tab navigation inside the currently open dialog.
      if(event.key==='Tab'&&modalRoot.innerHTML){const focusable=[...modalRoot.querySelectorAll('button:not([disabled]),input:not([disabled]):not([hidden]),textarea:not([disabled]),select:not([disabled]),a[href]')].filter(el=>el.getClientRects().length);if(!focusable.length)return;const first=focusable[0],last=focusable[focusable.length-1];if(event.shiftKey&&document.activeElement===first){event.preventDefault();last.focus();}else if(!event.shiftKey&&document.activeElement===last){event.preventDefault();first.focus();}}
    });
    document.addEventListener('visibilitychange',()=>{if(!document.hidden)rolloverIfNeeded();if(document.hidden&&breathTimer)stopBreathing();});
    window.addEventListener('focus',rolloverIfNeeded);
    window.setInterval(rolloverIfNeeded,60000);
  }
  function init() {
    document.querySelectorAll('[data-icon]').forEach(el=>{el.innerHTML=icon(el.dataset.icon)});
    bindEvents();render();
    if('serviceWorker' in navigator && (location.protocol==='https:'||location.hostname==='localhost'||location.hostname==='127.0.0.1')){
      window.addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').catch(()=>{}));
    }
  }
  init();
})();
